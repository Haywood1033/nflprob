<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFLProb</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230a0e1a'/%3E%3Cellipse cx='12' cy='12' rx='7' ry='5' fill='none' stroke='%232dd4bf' stroke-width='1.6'/%3E%3Cpath d='M6.5 12h11M9.5 9.7v4.6M12 9.2v5.6M14.5 9.7v4.6' stroke='%232dd4bf' stroke-width='1.3' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{--bg:#0a0e1a;--bg2:#0e1422;--bg3:#141e2e;--bd:rgba(255,255,255,0.10);--bd2:rgba(255,255,255,0.16);--t1:rgba(255,255,255,0.92);--t2:rgba(255,255,255,0.45);--t3:rgba(255,255,255,0.25);--teal:#2dd4bf;--green:#4ade80;--amber:#f59e0b;--red:#f87171;--purple:#a78bfa;--blue:#60a5fa;--mono:'Space Mono',monospace;--sans:'DM Sans',system-ui,sans-serif;--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:14px;min-height:100vh;overflow-x:hidden}
.hdr{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:0.5px solid var(--bd);background:var(--bg);position:sticky;top:0;z-index:100}
.logo{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--t1)}
.hdr-week{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.18);padding:4px 10px;border-radius:20px}
.status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t3);margin-left:auto;font-family:var(--mono)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--t3);transition:background .2s}
.dot.live{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.icon{display:inline-flex;flex-shrink:0}
.icon svg{display:block}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,0.12);border-top-color:var(--teal);animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-state{text-align:center;padding:48px 20px;color:var(--t2)}
.error-state{text-align:center;padding:40px 20px;color:var(--t2)}
.error-state h3{color:var(--red);font-size:15px;margin-bottom:8px}
.error-state summary{cursor:pointer;font-size:11px;font-family:var(--mono);color:var(--t3);margin-top:10px}
.error-state pre{font-size:11px;font-family:var(--mono);color:var(--t3);white-space:pre-wrap;margin-top:8px;text-align:left;background:var(--bg2);border-radius:6px;padding:10px;border:0.5px solid var(--bd)}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);border:0.5px solid var(--bd)}
.table-scroll .td-table{border:none}
.num-col{text-align:right !important}
.td-table thead th.num-col,.td-table tbody td.num-col{text-align:right}
.td-prob,.td-touch{text-align:right}
.tabs{display:flex;gap:6px;padding:10px 18px;border-bottom:0.5px solid rgba(255,255,255,0.08);background:var(--bg);overflow-x:auto}
.tab{padding:6px 14px;font-size:11px;font-weight:500;cursor:pointer;border-radius:20px;color:rgba(255,255,255,0.45);white-space:nowrap;border:0.5px solid transparent;font-family:var(--mono);transition:color .15s,background .15s}
.tab:hover:not(.active){color:var(--t1);background:rgba(255,255,255,0.06)}
.tab.active{color:var(--green);background:rgba(74,222,128,0.1);border-color:rgba(74,222,128,0.25)}
.wrap{padding:16px 20px}
.empty{text-align:center;padding:40px 20px;color:var(--t3)}
.empty h3{font-size:15px;color:var(--t2);margin-bottom:8px}
.badge-shootout{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-family:var(--mono);padding:2px 6px;border-radius:3px;background:rgba(245,158,11,.1);color:var(--amber);border:1px solid rgba(245,158,11,.25)}
.badge-lowscore{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-family:var(--mono);padding:2px 6px;border-radius:3px;background:rgba(96,165,250,.1);color:var(--blue);border:1px solid rgba(96,165,250,.25)}
.td-table{width:100%;border-collapse:collapse;font-size:13px}
.td-table thead th{text-align:left;padding:9px 12px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;border-bottom:0.5px solid var(--bd);background:var(--bg2)}
.td-table tbody td{padding:10px 12px;border-bottom:0.5px solid var(--bd)}
.td-table tbody tr:hover{background:var(--bg2)}
.td-name{font-weight:600;color:var(--t1)}
.td-pos{font-family:var(--mono);font-size:11px;color:var(--t3)}
.td-team{font-size:12px;color:var(--t2)}
.td-prob{font-family:var(--mono);font-weight:700;color:var(--teal)}
.td-touch{font-family:var(--mono);font-size:12px;color:var(--t3)}
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.matchup-select{background:var(--bg2);border:0.5px solid rgba(255,255,255,0.16);border-radius:6px;color:var(--t1);font-family:var(--mono);font-size:12px;padding:7px 12px;min-width:200px}
.pos-pills{display:flex;gap:6px;flex-wrap:wrap}
.pos-pill{padding:6px 13px;font-size:11px;font-weight:600;cursor:pointer;border-radius:20px;color:var(--t3);border:0.5px solid rgba(255,255,255,0.14);font-family:var(--mono);background:transparent;transition:color .15s,background .15s,border-color .15s}
.pos-pill:hover:not(.on){color:var(--t1);border-color:rgba(255,255,255,0.28)}
.pos-pill.on{color:var(--teal);background:rgba(45,212,191,.1);border-color:rgba(45,212,191,.3)}
.filter-count{font-size:11px;font-family:var(--mono);color:var(--t3);margin-left:auto}
.sig-filter-pills{display:flex;gap:6px;flex-wrap:wrap}
.sig-filter-pill{padding:5px 11px;font-size:10px;font-weight:600;cursor:pointer;border-radius:14px;color:var(--t3);border:0.5px solid rgba(255,255,255,0.14);font-family:var(--mono);background:transparent;transition:color .15s,background .15s,border-color .15s}
.sig-filter-pill:hover:not(.on){color:var(--t1);border-color:rgba(255,255,255,0.28)}
.sig-filter-pill.on{color:var(--purple);background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.3)}
.sig-chips{display:flex;gap:4px;flex-wrap:wrap;max-width:180px}
.sig-chip{font-family:var(--mono);font-size:8px;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap}
.sig-chip.on{background:rgba(45,212,191,.12);color:var(--teal);border:1px solid rgba(45,212,191,.3)}
.sig-chip.off{background:rgba(255,255,255,.03);color:var(--t3);border:1px solid rgba(255,255,255,.08)}
.expand-row{cursor:pointer}
.expand-row:hover{background:var(--bg2)}
.expand-arrow{display:inline-flex;color:var(--t3);margin-right:6px;vertical-align:-1px}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.detail-block-hdr{font-size:9px;font-family:var(--mono);color:var(--t3);text-transform:uppercase;margin-bottom:8px}
.detail-sig-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px}
.detail-sig-desc{font-size:10px;color:var(--t3);font-family:var(--mono)}
.game-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-bottom:16px}
.gs-card{flex-shrink:0;width:180px;background:var(--bg2);border:0.5px solid rgba(255,255,255,0.11);border-radius:8px;padding:10px 12px;cursor:pointer;transition:border-color .15s}
.gs-card:hover{border-color:rgba(255,255,255,0.24)}
.gs-card.high-scoring{border-color:rgba(245,158,11,.3)}
.gs-status{font-size:9px;font-family:var(--mono);color:var(--t3);margin-bottom:6px}
.gs-team{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.gs-team-name{font-size:12px;font-weight:600;color:var(--t1)}
.gs-team-td{font-size:10px;font-family:var(--mono);color:var(--teal)}
.gs-divider{height:1px;background:var(--bd);margin:6px 0}
.gs-total{display:flex;justify-content:space-between;align-items:baseline}
.gs-total-pts{font-size:16px;font-weight:700;font-family:var(--mono)}
.gs-meta{font-size:9px;font-family:var(--mono);color:var(--t3)}
.today-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.today-kpi{background:var(--bg2);border:0.5px solid rgba(255,255,255,0.11);border-radius:8px;padding:12px 14px}
.today-kpi-val{font-size:22px;font-weight:700;font-family:var(--mono)}
.today-kpi-lbl{font-size:10px;font-family:var(--mono);color:var(--t3);margin-top:4px}
.today-section{background:var(--bg2);border:0.5px solid rgba(255,255,255,0.11);border-radius:8px;margin-bottom:14px;overflow:hidden}
.today-section-hdr{padding:12px 16px;border-bottom:0.5px solid var(--bd);font-size:10px;font-family:var(--mono);color:var(--t3);display:flex;justify-content:space-between}
.today-section-body{padding:14px 16px}
.today-target{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--bg3)}
.today-target:last-child{border-bottom:none}
.today-target-rank{font-size:11px;font-family:var(--mono);color:var(--t3);width:18px}
.today-target-name{font-size:13px;font-weight:600;color:var(--t1)}
.today-target-sub{font-size:10px;font-family:var(--mono);color:var(--t3);margin-top:1px}
.today-target-prob{font-size:14px;font-family:var(--mono);font-weight:700}
.today-two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.today-two-col{grid-template-columns:1fr}}
@media(max-width:480px){
  .wrap{padding:12px}
  .hdr{padding:10px 14px}
  .tabs{padding:8px 12px}
  .slate-grid{grid-template-columns:1fr}
  .today-kpis{grid-template-columns:repeat(2,1fr)}
  .best-play-prob{font-size:30px}
  .parlay-combined-val{font-size:26px}
}
.best-play-card{background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);border:0.5px solid rgba(245,158,11,.25);border-radius:8px;padding:16px;margin-bottom:16px;cursor:pointer;transition:border-color .15s}
.best-play-card:hover{border-color:rgba(245,158,11,.5)}
.best-play-hdr{font-size:10px;font-family:var(--mono);color:var(--t3);margin-bottom:12px;display:flex;justify-content:space-between}
.best-play-name{font-size:19px;font-weight:700;color:var(--t1)}
.best-play-sub{font-size:11px;font-family:var(--mono);color:var(--t3);margin-bottom:10px}
.best-play-prob{font-size:38px;font-weight:700;font-family:var(--mono);color:var(--amber)}
.best-play-badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:3px 9px;border-radius:4px;margin-top:8px;display:inline-flex;align-items:center;gap:5px}
.game-lean-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bg3);font-size:12px}
.game-lean-teams{font-weight:600;color:var(--t1)}
.game-lean-meta{display:flex;gap:14px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--t3)}
.slate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.slate-card{background:var(--bg2);border:0.5px solid rgba(255,255,255,0.11);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.slate-card:hover{border-color:rgba(255,255,255,0.22);transform:translateY(-1px)}
.slate-card.shootout{border-color:rgba(245,158,11,.3)}
.slate-hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg3);border-bottom:0.5px solid var(--bd)}
.slate-weather{font-size:10px;font-family:var(--mono);color:var(--t3)}
.slate-matchup{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px}
.slate-team{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.slate-logo-wrap{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.10),rgba(255,255,255,0.03));border:0.5px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;overflow:hidden}
.slate-logo{width:40px;height:40px;object-fit:contain;image-rendering:-webkit-optimize-contrast}
.slate-team-name{font-size:11px;font-weight:600;color:var(--t1)}
.slate-team-implied{font-size:24px;font-weight:700;font-family:var(--mono)}
.slate-vs{font-size:10px;font-family:var(--mono);color:var(--t3);padding:0 8px}
.slate-meta-row{display:flex;align-items:center;padding:10px 14px;border-top:0.5px solid var(--bg3);border-bottom:0.5px solid var(--bg3)}
.slate-meta-item{flex:1;text-align:center}
.slate-meta-item.center{flex:0 0 auto;padding:0 14px}
.slate-meta-val{font-size:14px;font-weight:700;font-family:var(--mono);color:var(--teal)}
.slate-meta-lbl{font-size:9px;font-family:var(--mono);color:var(--t3);margin-top:2px}
.slate-targets{padding:10px 14px}
.slate-target-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:4px 0}
.slate-target-lbl{color:var(--t3);font-family:var(--mono);font-size:9px}
.slate-target-val{color:var(--t1);font-weight:600}
.slate-target-prob{color:var(--teal);font-family:var(--mono);font-weight:700}
.slate-top-prop{padding:10px 14px;background:rgba(167,139,250,.06);border-top:0.5px solid var(--bg3)}
.slate-top-prop-lbl{font-size:9px;font-family:var(--mono);color:var(--purple);margin-bottom:3px}
.slate-modal-section{padding:12px 20px}
.slate-modal-section-hdr{font-size:10px;font-family:var(--mono);color:var(--t3);margin-bottom:8px}

/* DETAIL DRAWER — replaces both the old inline row-expansion (which pushed every row below
   it down the page, awkward once the expanded content had "a lot of words") and the old
   centered dialog-with-dark-backdrop for game cards. Same pattern as hrprob's player/pitcher
   drawers: fixed to the right edge, no dimming backdrop, no body-scroll lock — the list
   behind it stays fully visible and scrollable. Only one drawer, reused for every tab's
   detail view (player row, best-play row, game card), so there's one open/close mechanism
   and one set of interaction rules (click outside or Escape closes it) for the whole app. */
#detail-drawer{display:none;position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:var(--bg2);border-left:0.5px solid rgba(255,255,255,0.16);box-shadow:-24px 0 48px rgba(0,0,0,.55);z-index:500;overflow-y:auto}
.dd-header{padding:16px 20px;background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);border-bottom:1px solid var(--teal);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:sticky;top:0}
.dd-name{font-size:17px;font-weight:700;color:var(--t1)}
.dd-sub{font-size:11px;font-family:var(--mono);color:var(--t3);margin-top:3px}
.dd-close{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--t3);cursor:pointer;background:rgba(255,255,255,0.05);flex-shrink:0;transition:background .15s,color .15s}
.dd-close:hover{background:rgba(255,255,255,0.12);color:var(--t1)}
.dd-body{padding:16px 20px}
@media(max-width:600px){#detail-drawer{width:100%;max-width:100%;border-left:none}}
.best-list{display:flex;flex-direction:column;gap:8px}
.best-row{background:var(--bg2);border:0.5px solid rgba(255,255,255,0.11);border-radius:8px;padding:12px 16px}
.best-row-top{display:flex;align-items:center;gap:14px;cursor:pointer;margin:-4px;padding:4px;border-radius:6px;transition:background .15s}
.best-row-top:hover{background:rgba(255,255,255,0.04)}
.best-row.elite{border-color:rgba(245,158,11,.3)}
.best-row.allstar{border-color:rgba(96,165,250,.3)}
.best-rank{font-family:var(--mono);font-size:13px;color:var(--t3);width:22px;text-align:center}
.best-type-tag{font-family:var(--mono);font-size:9px;font-weight:700;padding:3px 8px;border-radius:4px;width:44px;text-align:center}
.best-type-td{background:rgba(74,222,128,.1);color:var(--green);border:1px solid rgba(74,222,128,.25)}
.best-type-rush{background:rgba(45,212,191,.1);color:var(--teal);border:1px solid rgba(45,212,191,.25)}
.best-type-rec{background:rgba(167,139,250,.1);color:var(--purple);border:1px solid rgba(167,139,250,.25)}
.best-type-pass{background:rgba(96,165,250,.1);color:var(--blue);border:1px solid rgba(96,165,250,.25)}
.best-info{flex:1;min-width:0}
.best-name{font-size:14px;font-weight:600;color:var(--t1)}
.best-sub{font-size:11px;font-family:var(--mono);color:var(--t3);margin-top:1px}
.best-value{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--teal);min-width:70px;text-align:right}
.best-badge{font-family:var(--mono);font-size:9px;font-weight:700;min-width:90px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:4px}

/* DFS LINEUP OPTIMIZER */
.dfs-upload-zone{border:1.5px dashed rgba(255,255,255,0.18);border-radius:12px;padding:48px 24px;text-align:center;transition:border-color .15s,background .15s}
.dfs-upload-zone.dragover{border-color:var(--teal);background:rgba(45,212,191,.05)}
.dfs-upload-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:20px;background:rgba(45,212,191,.1);border:0.5px solid rgba(45,212,191,.3);color:var(--teal);font-family:var(--mono);font-size:12px;font-weight:700;cursor:pointer;transition:background .15s}
.dfs-upload-btn:hover{background:rgba(45,212,191,.18)}
.dfs-ctrl{font-family:var(--mono);font-size:9px;font-weight:700;padding:4px 9px;border-radius:10px;border:0.5px solid rgba(255,255,255,0.14);color:var(--t3);cursor:pointer;white-space:nowrap;transition:all .15s}
.dfs-ctrl:hover{border-color:rgba(255,255,255,0.3);color:var(--t1)}
.dfs-ctrl.on{color:var(--teal);background:rgba(45,212,191,.12);border-color:rgba(45,212,191,.35)}
.dfs-ctrl-cpt.on{color:var(--amber);background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.35)}
.dfs-ctrl-x.on{color:var(--red);background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.35)}
.dfs-row-excluded{opacity:.4}
.dfs-row-excluded .td-name{text-decoration:line-through}
.dfs-build-btn{padding:10px 24px;border-radius:20px;background:rgba(74,222,128,.12);border:0.5px solid rgba(74,222,128,.35);color:var(--green);font-family:var(--mono);font-size:12px;font-weight:700;cursor:pointer;transition:background .15s}
.dfs-build-btn:hover{background:rgba(74,222,128,.2)}
.dfs-build-btn.disabled{opacity:.4;cursor:default;pointer-events:none}
.dfs-link-btn{font-family:var(--mono);font-size:11px;color:var(--t3);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.dfs-link-btn:hover{color:var(--t1)}
.dfs-cap-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:6px}
.dfs-cap-fill{height:100%;border-radius:3px;background:var(--teal);transition:width .3s}

/* PARLAY BUILDER */
.parlay-subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.parlay-subtab{padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;border-radius:20px;color:var(--t3);border:0.5px solid rgba(255,255,255,0.14);font-family:var(--mono)}
.parlay-subtab.on{color:var(--amber);background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3)}
.parlay-card{background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);border:0.5px solid rgba(245,158,11,.25);border-radius:10px;padding:20px;margin-bottom:16px}

<body>
  <div class="hdr">
    <div class="logo">NFLPROB</div>
    <div class="hdr-week" id="weekLabel">Week —</div>
    <div class="status"><span class="dot"></span><span id="statusText">Loading…</span></div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="week">This Week</div>
    <div class="tab" data-tab="team">Slate</div>
    <div class="tab" data-tab="td">Anytime TD</div>
    <div class="tab" data-tab="rush">Rushing Yds</div>
    <div class="tab" data-tab="rec">Receiving Yds</div>
    <div class="tab" data-tab="pass">Passing Yds</div>
    <div class="tab" data-tab="best">Best Plays</div>
    <div class="tab" data-tab="parlay">Parlay Builder</div>
    <div class="tab" data-tab="dfs">Lineup Builder</div>
    <div class="tab" data-tab="season">Season Projections</div>
    <div class="tab" data-tab="accuracy">Accuracy</div>
  </div>
  <div class="wrap" id="content"><div class="loading-state"><div class="spinner"></div><div>Loading this week's slate…</div></div></div>
<script>
// Crisp inline-SVG icon set, replacing emoji glyphs (which render inconsistently across OS
// and browsers — different weight, different style, sometimes missing entirely) with a
// single consistent, currentColor-aware line-icon system.
const ICONS = {
  flame:   '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1.2 3.1-2 4.4-2 7.6a4 4 0 1 0 8 0c0-1-.4-1.8-.9-2.3.7 3.6-1 4.7-2 4.7a2.3 2.3 0 0 1-2.3-2.3c0-1.9 1.4-2.6 1.4-4.6 0-1.3-.8-2.4-2.2-3.1z"/></svg>',
  shield:  '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.5s7.5-3.6 7.5-9.5V5.3L12 2.5 4.5 5.3V12c0 5.9 7.5 9.5 7.5 9.5z"/></svg>',
  bolt:    '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M13 2 4.5 14h6l-1 8L21 10h-6l1-8z"/></svg>',
  trophy:  '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4zM7 5H4.5A2.5 2.5 0 0 0 7 7.5M17 5h2.5A2.5 2.5 0 0 1 17 7.5"/></svg>',
  star:    '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="m12 2.5 3 6.3 6.8 1-4.9 4.9 1.2 6.8L12 18l-6.1 3.5 1.2-6.8-4.9-4.9 6.8-1 3-6.3z"/></svg>',
  bulb:    '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18h5M10.3 21.5h3.4M12 2.5a6 6 0 0 0-3.8 10.6c.5.5.8 1.3.8 2.1v.3h6v-.3c0-.8.3-1.6.8-2.1A6 6 0 0 0 12 2.5z"/></svg>',
  sun:     '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M4.7 4.7l1.5 1.5M17.8 17.8l1.5 1.5M2.5 12h2.2M19.3 12h2.2M4.7 19.3l1.5-1.5M17.8 6.2l1.5-1.5"/></svg>',
  check:   '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  cross:   '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  chevron: '<svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  target:  '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>',
};
function icon(name, style) { return `<span class="icon"${style?` style="${style}"`:''}>${ICONS[name]||''}</span>`; }
// Server-computed badges still return an emoji-prefixed label (e.g. "🏆 Elite Play") — these
// two helpers translate that into an icon + clean text on the client without needing to
// change the API contract every badge-rendering call site relies on.
function badgeIcon(label) {
  if (!label) return '';
  if (label.includes('Elite')) return icon('trophy', 'color:inherit');
  if (label.includes('All-Star')) return icon('star', 'color:inherit');
  if (label.includes('Value')) return icon('bulb', 'color:inherit');
  return '';
}
function badgeText(label) { return (label || '').replace(/^\p{Extended_Pictographic}️?\s*/u, ''); }
function badgeHTML(badge, cls) {
  if (!badge) return '';
  return `<span class="${cls}" style="display:inline-flex;align-items:center;gap:4px;color:${badge.color};border-color:${badge.color}66">${badgeIcon(badge.label)}${badgeText(badge.label)}</span>`;
}

function setStatus(cached) {
  const dot = document.querySelector('.status .dot');
  const text = document.getElementById('statusText');
  text.textContent = cached ? 'Cached' : 'Live';
  if (dot) dot.classList.toggle('live', !cached);
}
function loadingHTML(label) { return `<div class="loading-state"><div class="spinner"></div><div>${label}</div></div>`; }
function errorHTML(e) { return `<div class="error-state"><h3>Something went wrong loading this data</h3><div>The app will keep working on other tabs — try switching tabs and back, or reload.</div><details><summary>Technical detail</summary><pre>${(e && e.message) || e}</pre></details></div>`; }

// DETAIL DRAWER — one reusable slide-over panel for every "show me more" interaction in the
// app (a player row, a best-play row, a game card). Built once at load and just repopulated
// on each open, same as a single-instance dialog. Deliberately NOT a centered modal: no
// dimming backdrop and no body-scroll lock, so the list/table it was opened from stays fully
// visible and usable — clicking a different row just swaps the drawer's content in place.
const detailDrawer = document.createElement('div');
detailDrawer.id = 'detail-drawer';
detailDrawer.innerHTML = `<div class="dd-header"><div id="dd-header-content" style="flex:1;min-width:0"></div><div class="dd-close" id="dd-close-btn"></div></div><div class="dd-body" id="dd-body-content"></div>`;
document.body.appendChild(detailDrawer);
detailDrawer.querySelector('#dd-close-btn').innerHTML = icon('cross');
detailDrawer.querySelector('#dd-close-btn').addEventListener('click', closeDrawer);

let _ddOpenedAt = 0;
function openDrawer(headerHTML, bodyHTML) {
  document.getElementById('dd-header-content').innerHTML = headerHTML;
  document.getElementById('dd-body-content').innerHTML = bodyHTML;
  detailDrawer.style.display = 'block';
  detailDrawer.scrollTop = 0;
  _ddOpenedAt = Date.now();
}
function closeDrawer() { detailDrawer.style.display = 'none'; }
// Click-outside-closes, registered once. The 50ms guard skips the very click that just opened
// (or swapped) the drawer — that click is still bubbling up to document when this fires, and
// would otherwise immediately close what it just opened.
document.addEventListener('click', (e) => {
  if (detailDrawer.style.display === 'block' && Date.now() - _ddOpenedAt >= 50 && !detailDrawer.contains(e.target)) closeDrawer();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

// SHORT-LIVED CLIENT-SIDE FETCH CACHE — a lot of the perceived "every tab is slow" feeling
// isn't the backend, it's this file: the same endpoint (e.g. /api/props?week=2) gets
// independently re-fetched from This Week, Slate, Anytime TD, Best Plays, and Parlay Builder
// — five separate network round-trips (each re-running the backend's own external-API fetch
// cycle against ESPN/nflverse) for data that was already pulled seconds ago just by clicking
// through tabs. Caching per-URL in memory for the lifetime of this page load means hopping
// between tabs that share an endpoint costs nothing after the first hit; a real reload always
// starts empty, so this can never show data older than one page visit.
const _fetchCache = new Map();
const FETCH_CACHE_TTL = 90 * 1000;
async function cachedJSON(url) {
  const hit = _fetchCache.get(url);
  if (hit && Date.now() - hit.ts < FETCH_CACHE_TTL) return hit.data;
  const data = await fetch(url).then(r => r.json());
  _fetchCache.set(url, { data, ts: Date.now() });
  return data;
}

const params = new URLSearchParams(location.search);
let week = params.get('week'); // null if not explicitly given in the URL - auto-detected below in that case
document.getElementById('weekLabel').textContent = 'Week —';
let currentTab = 'week';
const rawData = { td: null, rush: null, rec: null, pass: null };
const filterState = {
  td:   { matchup: 'all', position: 'all', signal: 'all' },
  rush: { matchup: 'all', signal: 'all' },
  rec:  { matchup: 'all', signal: 'all' },
  pass: { matchup: 'all', signal: 'all' },
};
const TAB_SIGNALS = {
  td:   ['High Usage', 'Favorable Matchup', 'Hot Streak', 'Shootout Game', 'Featured Role', 'Sample Confidence'],
  rush: ['High Usage', 'Favorable Matchup', 'Hot Streak', 'Bellcow Volume', 'Sample Confidence'],
  rec:  ['High Usage', 'Favorable Matchup', 'Hot Streak', 'Featured Target', 'Sample Confidence'],
  pass: ['High Volume', 'Favorable Matchup', 'Hot Streak', 'Pass-Heavy Script', 'Sample Confidence'],
};
function matchupKey(p) { return [p.team, p.opponent].sort().join(' vs '); }
function buildMatchupOptions(players) {
  const seen = new Set(); const options = [];
  for (const p of players) { const key = matchupKey(p); if (!seen.has(key)) { seen.add(key); options.push(key); } }
  return options.sort();
}
function hasActiveSignal(p, label) { return !!(p.signals && p.signals.some(s => s.label === label && s.active)); }
function filterPlayers(players, matchup, position, signal) {
  return players.filter(p => {
    if (matchup !== 'all' && matchupKey(p) !== matchup) return false;
    if (position && position !== 'all' && p.position !== position) return false;
    if (signal && signal !== 'all' && !hasActiveSignal(p, signal)) return false;
    return true;
  });
}
function renderMatchupSelect(tab, players) {
  const options = buildMatchupOptions(players); const current = filterState[tab].matchup;
  return `<select class="matchup-select" id="matchupSelect-${tab}">
    <option value="all"${current==='all'?' selected':''}>All Games</option>
    ${options.map(o => `<option value="${o}"${current===o?' selected':''}>${o}</option>`).join('')}
  </select>`;
}
function renderPositionPills(tab, positions) {
  const current = filterState[tab].position;
  return `<div class="pos-pills"><div class="pos-pill${current==='all'?' on':''}" data-pos="all" data-tab="${tab}">All</div>
    ${positions.map(pos => `<div class="pos-pill${current===pos?' on':''}" data-pos="${pos}" data-tab="${tab}">${pos}</div>`).join('')}</div>`;
}
function attachFilterHandlers(tab, rerenderFn) {
  const select = document.getElementById('matchupSelect-' + tab);
  if (select) select.addEventListener('change', () => { filterState[tab].matchup = select.value; rerenderFn(rawData[tab]); });
  document.querySelectorAll(`.pos-pill[data-tab="${tab}"]`).forEach(pill => {
    pill.addEventListener('click', () => { filterState[tab].position = pill.dataset.pos; rerenderFn(rawData[tab]); });
  });
}
const SIGNAL_ABBR = { 'High Usage':'USE','High Volume':'VOL','Favorable Matchup':'EDGE','Hot Streak':'HOT','Shootout Game':'SHOOT','Featured Role':'ROLE','Sample Confidence':'CONF','Bellcow Volume':'BCOW','Featured Target':'TGT','Pass-Heavy Script':'SCRIPT' };
const SIGNAL_DESC = {
  'High Usage':'Meaningful volume above the position baseline','High Volume':'Pass attempts per game above starter baseline',
  'Favorable Matchup':'Opponent allows more than league-average rate to this stat','Hot Streak':'Strong performance in 2+ of last 3 games',
  'Shootout Game':"This week's projected total is 48+ points",'Featured Role':'Elevated role signal for this position',
  'Sample Confidence':'Enough recent volume that the read is not small-sample noise','Bellcow Volume':"Projected carries 16+ this week",
  'Featured Target':"Projected targets 8+ this week",'Pass-Heavy Script':"Projected attempts 36+ this week",
};
function rowKey(p) { return p.name + '|' + p.team; }
function signalFilterPillsHTML(tab, labels, active) {
  return `<div class="sig-filter-pills"><div class="sig-filter-pill${active==='all'?' on':''}" data-sigfilter-tab="${tab}" data-sigfilter="all">All Signals</div>
    ${labels.map(l => `<div class="sig-filter-pill${active===l?' on':''}" data-sigfilter-tab="${tab}" data-sigfilter="${l}">${SIGNAL_ABBR[l]||l}</div>`).join('')}</div>`;
}
function attachSignalFilterHandlers(tab, onPick) {
  document.querySelectorAll(`.sig-filter-pill[data-sigfilter-tab="${tab}"]`).forEach(p => p.addEventListener('click', () => onPick(p.dataset.sigfilter)));
}
function signalDetailListHTML(signals) {
  if (!signals || !signals.length) return '<div class="gs-meta">No signal data</div>';
  return signals.map(s => `<div class="detail-sig-row"><span style="color:${s.active?'var(--teal)':'var(--t3)'};display:inline-flex;align-items:center;gap:5px">${icon(s.active?'check':'cross')} ${s.label}</span></div><div class="detail-sig-desc" style="margin-bottom:6px">${SIGNAL_DESC[s.label]||''}</div>`).join('');
}
function signalChipsHTML(signals) {
  if (!signals || !signals.length) return '<span style="color:var(--t3);font-size:10px">—</span>';
  return `<div class="sig-chips">${signals.map(s => `<span class="sig-chip ${s.active?'on':'off'}" title="${s.label}${s.active?' — active':' — not met'}">${SIGNAL_ABBR[s.label]||s.label}</span>`).join('')}</div>`;
}
async function loadThisWeek() {
  document.getElementById('content').innerHTML = loadingHTML("Loading this week's slate…");
  try {
    const [teamRes, propsRes, rushRes, recRes, passRes] = await Promise.all([
      cachedJSON('/api/team-model?week=' + week),
      cachedJSON('/api/props?week=' + week),
      cachedJSON('/api/rush-props?week=' + week),
      cachedJSON('/api/rec-props?week=' + week),
      cachedJSON('/api/pass-props?week=' + week),
    ]);
    renderThisWeek(teamRes, propsRes, { td: propsRes.players||[], rush: rushRes.players||[], rec: recRes.players||[], pass: passRes.players||[] });
  } catch (e) { document.getElementById('content').innerHTML = errorHTML(e); }
}
function renderThisWeek(teamData, propsData, allProps) {
  setStatus(teamData.cached||propsData.cached);
  const games = teamData.games || []; const players = propsData.players || [];
  if (!games.length) { document.getElementById('content').innerHTML = '<div class="empty"><h3>No games found</h3></div>'; return; }
  const stripHTML = '<div class="game-strip">' + games.map(g => {
    const m = g.model||{}; const awayTop = players.filter(p=>p.team===g.awayTeam).sort((a,b)=>b.prob-a.prob)[0];
    const homeTop = players.filter(p=>p.team===g.homeTeam).sort((a,b)=>b.prob-a.prob)[0];
    const isHigh = m.shootoutSignal; const tc = m.shootoutSignal?'var(--amber)':m.lowScoringSignal?'var(--blue)':'var(--t1)';
    const lean = m.shootoutSignal?icon('flame','color:var(--amber)')+' Shootout':m.lowScoringSignal?icon('shield','color:var(--blue)')+' Low Scoring':'';
    return `<div class="gs-card${isHigh?' high-scoring':''}"><div class="gs-status">${lean}</div>
      <div class="gs-team"><span class="gs-team-name">${g.awayTeam}</span>${awayTop?`<span class="gs-team-td">${awayTop.prob}% ${awayTop.name.split(' ').pop()}</span>`:''}</div>
      <div class="gs-team"><span class="gs-team-name">${g.homeTeam}</span>${homeTop?`<span class="gs-team-td">${homeTop.prob}% ${homeTop.name.split(' ').pop()}</span>`:''}</div>
      <div class="gs-divider"></div><div class="gs-total"><span class="gs-total-pts" style="color:${tc}">${m.total??'—'}</span><span class="gs-meta">proj total</span></div></div>`;
  }).join('') + '</div>';
  const shootoutCount = games.filter(g=>g.model?.shootoutSignal).length;
  const eliteCount = players.filter(p=>p.badge?.label.includes('Elite')).length;
  const signalPlays = players.filter(p=>p.signalCount>=3);
  const kpiHTML = `<div class="today-kpis">
    <div class="today-kpi"><div class="today-kpi-val" style="color:var(--teal)">${games.length}</div><div class="today-kpi-lbl">Games</div></div>
    <div class="today-kpi"><div class="today-kpi-val" style="color:var(--amber)">${shootoutCount}</div><div class="today-kpi-lbl">Shootouts</div></div>
    <div class="today-kpi"><div class="today-kpi-val" style="color:var(--purple)">${signalPlays.length}</div><div class="today-kpi-lbl">Signal Plays</div></div>
    <div class="today-kpi"><div class="today-kpi-val" style="color:var(--green)">${eliteCount}</div><div class="today-kpi-lbl">Elite Plays</div></div></div>`;
  // Best Play This Week — the single highest composite pick across ALL prop types, same sort
  // as Best Plays (tier, then signal count, then relative value) but NOT gated by badge tier:
  // on a week with no Elite/All-Star play at all, this still surfaces the best available thing,
  // same as it always did before the badge-tightening work (just cross-type now instead of
  // TD-only).
  const bestOverall = allProps ? [...buildAllPlaysPool(allProps)].sort(sortPlays)[0] : null;
  const bestOverallHTML = bestOverall ? `<div class="best-play-card" data-best-overall-key="${rowKey(bestOverall)+'|'+bestOverall.propType}">
    <div class="best-play-hdr"><span style="display:inline-flex;align-items:center;gap:5px;color:var(--amber)">${icon('bolt')} Best Play This Week</span><span>COMPOSITE SIGNAL + VALUE SCORE</span></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start"><div>
      <div class="best-play-name">${bestOverall.name}${bestOverall.position?` <span style="color:var(--t3);font-weight:400;font-size:11px">(${bestOverall.position})</span>`:''}</div>
      <div class="best-play-sub">${bestOverall.team} vs ${bestOverall.opponent} · ${bestOverall.typeLabel}</div>
      ${bestOverall.badge?`<span class="best-play-badge" style="color:${bestOverall.badge.color};border:1px solid ${bestOverall.badge.color}66">${badgeIcon(bestOverall.badge.label)}${badgeText(bestOverall.badge.label)}</span>`:''}</div>
      <div style="text-align:right"><div class="best-play-prob">${bestOverall.displayValue}</div><div class="gs-meta">${bestOverall.typeLabel}</div></div></div></div>` : '';

  // Sharp Plays — a narrower, specifically-named bar: three signal categories (workload,
  // matchup, recent form) converging on one player AND an absolute floor on the real number,
  // not just "cleared enough signals." See isSharpPlay() — most weeks this will legitimately be
  // empty, which is the point (it's a "wait for a better setup" signal, not a guaranteed list).
  const sharpPool = allProps ? buildAllPlaysPool(allProps).filter(isSharpPlay).sort(sortPlays) : [];
  const sharpCriteria = 'TRIPLE CONVERGENCE · ALL-STAR+ · FAVORABLE MATCHUP REQUIRED';
  const slateReadText = (() => {
    if (!allProps) return '';
    const totalElite = buildAllPlaysPool(allProps).filter(p => tierWeight(p.badge) === 3).length;
    const lowScoringCt = games.filter(g => g.model?.lowScoringSignal).length;
    const parts = [`${games.length}-game slate this week.`];
    if (shootoutCount) parts.push(`${shootoutCount} shootout signal${shootoutCount===1?'':'s'} spotted.`);
    if (lowScoringCt) parts.push(`${lowScoringCt} low-scoring signal${lowScoringCt===1?'':'s'}.`);
    parts.push(totalElite ? `${totalElite} Elite-tier play${totalElite===1?'':'s'} on the board.` : 'No Elite-tier plays yet.');

// ACCURACY SNAPSHOT — captures this week's live projections (one row per team-model/TD/
// rush/rec/pass prediction) BEFORE kickoff, so they can be graded against real results later
// without any hindsight leaking in. Fires from the Slate tab specifically since that's the
// one place all four prop types load together in one request. Guarded to the real current
// week only (never a week the user is just browsing via ?week=) and at most once per page
// load — the backend's own save is idempotent too (ON CONFLICT DO NOTHING), this just avoids
// a redundant request on every Slate tab revisit.
const _snapshotAttempted = new Set();
function buildPredictionsSnapshot(teamData, props) {
  const games = teamData.games || [];
  const nameToAbbr = {};
  games.forEach(g => { nameToAbbr[g.homeTeam] = g.homeAbbr; nameToAbbr[g.awayTeam] = g.awayAbbr; });
  const abbrFor = (name) => nameToAbbr[name] || name;

  const preds = [];
  for (const g of games) {
    const m = g.model || {};
    if (m.homeWinProb != null) preds.push({ propType: 'game_winner', team: g.homeAbbr, opponent: g.awayAbbr, prediction: m.homeWinProb });
    if (m.total != null) preds.push({ propType: 'total_points', team: g.homeAbbr, opponent: g.awayAbbr, prediction: m.total });
  }
  const addPlayerProps = (list, propType, valueKey) => {
    (list || []).forEach(p => {
      if (p[valueKey] == null) return;
      const extra = propType === 'anytime_td' ? { tier: p.badge?.label || null, ci: p.ci?.tier || null } : { floor: p.floor, ceiling: p.ceiling };
      preds.push({ name: p.name, propType, team: abbrFor(p.team), opponent: abbrFor(p.opponent), prediction: p[valueKey], ...extra });
    });
  };
  addPlayerProps(props.td, 'anytime_td', 'prob');
  addPlayerProps(props.rush, 'rush_yds', 'projected');
  addPlayerProps(props.rec, 'rec_yds', 'projected');
  addPlayerProps(props.pass, 'pass_yds', 'projected');
  return preds;
}
// Returns { ok, skipped, error } so callers that care (the manual "snapshot now" button) can
// show the real outcome — fetch() alone only rejects on network failure, not on a 4xx/5xx
// response, so without checking res.ok a failed DB write looked identical to a successful one.
async function maybeSnapshotWeek(teamData, props) {
  if (!realCurrentWeek || Number(teamData.week) !== Number(realCurrentWeek)) return { skipped: true, reason: 'not the current week' };
  const key = teamData.year + '-W' + String(teamData.week).padStart(2, '0');
  if (_snapshotAttempted.has(key)) return { skipped: true, reason: 'already attempted this page load' };
  _snapshotAttempted.add(key);
  const predictions = buildPredictionsSnapshot(teamData, props);
  if (!predictions.length) return { skipped: true, reason: 'no predictions to save' };
  try {
    const res = await fetch('/api/history', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'save', week: key, predictions, teamModel: teamData }) });
    const data = await res.json().catch(() => null);
    if (!res.ok || data?.error) {
      console.warn('Accuracy snapshot failed:', data?.error || res.status);
      _snapshotAttempted.delete(key); // let a later attempt (e.g. revisiting Slate, or the manual button) retry instead of being silently blocked for the rest of this page load
      return { ok: false, error: data?.error || ('HTTP ' + res.status) };
    }
    return { ok: true, skipped: !!data.skipped, week: key };
  } catch (e) {
    console.warn('Accuracy snapshot request failed:', e.message);
    _snapshotAttempted.delete(key);
    return { ok: false, error: e.message };
  }
}

// ═══════════════ PARLAY BUILDER (Anytime TD only) ═══════════════
// Deliberately TD-only. Yardage props (rush/rec/pass) have no real "hit probability" without
// a sportsbook line to compare against — we only have a projected mean, so any yardage "leg"
// would need a fabricated line and an approximated probability around it. Anytime TD is
// different: it's a real, directly modeled probability of a binary event (does this player
// score a touchdown), not tied to any line assumption at all. So this tab only pulls from
// the same Anytime TD model used everywhere else in the app — nothing here is invented for
// parlay purposes specifically.
//
// Combined parlay probability = product of individual leg probabilities, which assumes
// INDEPENDENCE between legs. This is a real, meaningful simplification — legs from the SAME
// GAME are not independent (they're correlated with that game's actual script/total), so a
// same-game 2-leg parlay's true combined probability could be meaningfully higher or lower
// than naive multiplication suggests. The auto-generated 3/4/5-leg parlays therefore
// deliberately pick at most ONE leg per game, sidestepping this issue. The manual "add a
// second player from this game" feature explicitly reintroduces that correlation, and is
// labeled as such in the UI rather than hidden.

let parlayRaw = null;
let parlaySubtab = 'best3';
let parlayManualSelectedGames = new Set();
let parlayManualSecondLegs = {};
let parlayManualSecondLegOpen = new Set();

async function loadParlayBuilder() {
  document.getElementById('content').innerHTML = loadingHTML('Building parlays…');
  try {
    const d = await cachedJSON('/api/props?week=' + week);
    parlayRaw = d.players || [];
    renderParlayBuilder();
  } catch (e) { document.getElementById('content').innerHTML = errorHTML(e); }
}

function buildParlayLegPool(players) {
  const legs = players.map(p => ({ name:p.name, position:p.position, team:p.team, opponent:p.opponent, gameId:p.gameId,
    displayValue: 'Anytime TD', legProb: p.prob/100, normalizedValue: p.prob, signalCount:p.signalCount, badge:p.badge, signals:p.signals }));
  const notable = legs.filter(p => p.badge && tierWeight(p.badge) >= 2); // same All-Star/Elite bar as Best Plays — a parlay leg should be a genuinely strong play, not just any play
  notable.sort((a,b) => { const tw=tierWeight(b.badge)-tierWeight(a.badge); if (tw!==0) return tw; const sc=b.signalCount-a.signalCount; if (sc!==0) return sc; return b.normalizedValue-a.normalizedValue; });
  return notable;
}

// Best single leg per game — used both for the auto N-leg parlays (one leg per game, avoiding
// same-game correlation) and as the manual builder's default pick when a game is selected.
function bestLegPerGame(legPool) {
  const byGame = {};
  for (const leg of legPool) { if (!byGame[leg.gameId]) byGame[leg.gameId] = leg; } // legPool is pre-sorted, first-seen per game is already the best
  return Object.values(byGame);
}

function buildAutoParlay(legPool, n) {
  const perGame = bestLegPerGame(legPool);
  const legs = perGame.slice(0, n);
  const combinedProb = legs.reduce((acc, leg) => acc * leg.legProb, 1);
  return { legs, combinedProb };
}

function renderParlaySubtabs() {
  const labels = { best3:'Best 3-Leg', best4:'Best 4-Leg', best5:'Best 5-Leg', manual:'Build Your Own' };
  return `<div class="parlay-subtabs">${Object.entries(labels).map(([k,l]) =>

}

function renderParlayCard(title, legs, combinedProb) {

    return `<div class="parlay-game-row${isSelected?' selected':''}">
      <div class="parlay-game-top" data-manual-game="${g.gameId}">
        <div class="parlay-game-checkbox${isSelected?' checked':''}">${isSelected?icon('check'):''}</div>
        <div class="parlay-game-name">${g.teams}</div>
        <div class="parlay-game-top-play">${topLeg.name} — Anytime TD (${(topLeg.legProb*100).toFixed(1)}%)</div>
      </div>
      ${isSelected && otherLegs.length ? `<div class="parlay-secondleg-toggle" data-secondleg-toggle="${g.gameId}">${secondLegOpen?'▾':'▸'} + add a second TD scorer from this game (correlated)</div>` : ''}
      ${isSelected && secondLegOpen ? `<div class="parlay-secondleg-picker">
        ${otherLegs.map(l => `<div class="parlay-secondleg-option${secondLegKey===rowKey(l)?' picked':''}" data-secondleg-pick="${g.gameId}" data-secondleg-key="${rowKey(l)}">
          <span>${l.name} (${l.position})</span><span style="font-family:var(--mono)">${(l.legProb*100).toFixed(1)}%</span></div>`).join('')}
      </div>` : ''}
    </div>`;
  }).join('');

  const selectedLegs = [];
  for (const gameId of parlayManualSelectedGames) {
    const g = gamesMap[gameId]; if (!g) continue;
    selectedLegs.push(g.legs[0]);
    const secondKey = parlayManualSecondLegs[gameId];
    if (secondKey) { const secondLeg = g.legs.find(l => rowKey(l)===secondKey); if (secondLeg) selectedLegs.push(secondLeg); }
  }
  const combinedProb = selectedLegs.length ? selectedLegs.reduce((acc,l) => acc*l.legProb, 1) : 0;
  const hasCorrelatedPair = Object.values(parlayManualSecondLegs).some(v => v);

  const summaryHTML = selectedLegs.length ? `<div class="parlay-card"><div class="parlay-hdr">
    <div class="parlay-title">Your Parlay (${selectedLegs.length} legs)</div>
    <div class="parlay-combined"><div class="parlay-combined-val">${(combinedProb*100).toFixed(1)}%</div><div class="parlay-combined-lbl">Combined Hit Rate</div></div></div>
    ${selectedLegs.map((leg,i) => `<div class="parlay-leg"><div class="parlay-leg-num">${i+1}</div>
      <div class="parlay-leg-info"><div class="parlay-leg-name">${leg.name} <span style="color:var(--t3);font-weight:400;font-size:11px">(${leg.position})</span></div><div class="parlay-leg-detail">${leg.team} vs ${leg.opponent} — Anytime TD</div></div>
      <div class="parlay-leg-prob">${(leg.legProb*100).toFixed(1)}%</div></div>`).join('')}
    ${hasCorrelatedPair ? `<div class="parlay-disclaimer"><span class="parlay-correlated-tag">CORRELATED LEGS</span> You've added 2 TD scorers from the same game. Their outcomes aren't independent (both are tied to that game's actual script/total) — the combined probability shown above assumes independence and is likely LESS accurate for this parlay than for single-leg-per-game ones.</div>` : `<div class="parlay-disclaimer">Every leg is the model's real Anytime TD probability. Combined probability assumes independent legs.</div>`}
  </div>` : '<div class="empty" style="padding:20px 4px"><h3>Select games below to build your parlay</h3></div>';

  return summaryHTML + `<div class="parlay-game-picker">${pickerHTML}</div>`;
}

function attachManualParlayHandlers(legPool) {
  document.querySelectorAll('[data-manual-game]').forEach(el => el.addEventListener('click', () => {
    const gameId = el.dataset.manualGame;
    if (parlayManualSelectedGames.has(gameId)) { parlayManualSelectedGames.delete(gameId); delete parlayManualSecondLegs[gameId]; parlayManualSecondLegOpen.delete(gameId); }
    else parlayManualSelectedGames.add(gameId);
    renderParlayBuilder();
  }));
  document.querySelectorAll('[data-secondleg-toggle]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation(); const gameId = el.dataset.secondlegToggle;
    if (parlayManualSecondLegOpen.has(gameId)) parlayManualSecondLegOpen.delete(gameId); else parlayManualSecondLegOpen.add(gameId);
    renderParlayBuilder();
  }));
  document.querySelectorAll('[data-secondleg-pick]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation(); const gameId = el.dataset.secondlegPick; const key = el.dataset.secondlegKey;
    parlayManualSecondLegs[gameId] = parlayManualSecondLegs[gameId] === key ? null : key;
    renderParlayBuilder();
  }));
}

// ═══════════════ DFS LINEUP BUILDER (DK Showdown: Captain + 5 FLEX) ═══════════════
// Upload a DK salary CSV/XLSX, run nflprob's real per-player models (same pass/rush/rec/TD
// functions every other tab uses) against every player in the file, let the user lock "must
// play" players or force a specific Captain, then solve the true salary-cap-optimal lineup
// server-side (exact knapsack, not a heuristic — see lib/dfs-optimizer.js). Single-game
// Showdown only; a multi-game Classic slate has a different roster shape entirely.

const dfsState = { players: [], awayAbbr: null, homeAbbr: null, year: null, locked: new Set(), captainLock: null, excluded: new Set(), lastResult: null };

function dfsSplitCSVLine(line) {
  const out = []; let cur = ''; let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) { if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQuotes = false; } else cur += c; }
    else { if (c === '"') inQuotes = true; else if (c === ',') { out.push(cur); cur = ''; } else cur += c; }
  }
  out.push(cur);
  return out;
}
function dfsParseCSV(text) {
  const lines = text.replace(/^﻿/, '').trim().split(/\r?\n/);
  const headers = dfsSplitCSVLine(lines[0]).map(h => h.trim());
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const cells = dfsSplitCSVLine(line);
    const row = {};
    headers.forEach((h, i) => row[h] = (cells[i] || '').trim());
    return row;
  });
}
function dfsRowsFromAOA(aoa) {
  const headers = (aoa[0] || []).map(h => String(h || '').trim());
  return aoa.slice(1).filter(r => r.some(c => c !== '' && c != null)).map(r => {
    const row = {};
    headers.forEach((h, i) => row[h] = r[i] != null ? String(r[i]).trim() : '');
    return row;
  });
}

function dfsUploadHTML() {
  return `<div class="dfs-upload-zone" id="dfsDropZone">
    <h3 style="font-size:16px;margin-bottom:8px">Upload a DraftKings Showdown salary file</h3>
    <div style="margin:0 auto 18px;color:var(--t3);font-size:12px;max-width:440px;line-height:1.6">
      CSV or Excel export from a DK Showdown (Captain + FLEX, single-game) contest. We run
      nflprob's own matchup-adjusted projections against every player in the file — then you
      lock key players or force a Captain before building the salary-cap-optimal lineup.
    </div>
    <label class="dfs-upload-btn">${icon('bolt')} Choose File
      <input type="file" id="dfsFileInput" accept=".csv,.xlsx,.xls" style="display:none">
    </label>
    <div id="dfsUploadStatus" style="margin-top:12px;font-size:11px;font-family:var(--mono);color:var(--t3)"></div>
  </div>`;
}

function loadDfsOptimizer() {
  setStatus(false);
  if (dfsState.players.length) { renderDfsPlayerTable(); return; }
  document.getElementById('content').innerHTML = dfsUploadHTML();
  document.getElementById('dfsFileInput').addEventListener('change', dfsHandleFile);
  const zone = document.getElementById('dfsDropZone');
  ['dragover', 'dragleave', 'drop'].forEach(evt => zone.addEventListener(evt, e => {
    e.preventDefault();
    zone.classList.toggle('dragover', evt === 'dragover');
    if (evt === 'drop' && e.dataTransfer.files[0]) dfsProcessFile(e.dataTransfer.files[0]);
  }));
}

function dfsHandleFile(e) { if (e.target.files[0]) dfsProcessFile(e.target.files[0]); }

function dfsProcessFile(file) {
  const statusEl = document.getElementById('dfsUploadStatus');
  statusEl.textContent = 'Parsing ' + file.name + '…';
  const isExcel = /\.xlsx?$/i.test(file.name);
  const reader = new FileReader();
  reader.onerror = () => { statusEl.innerHTML = `<span style="color:var(--red)">Could not read file</span>`; };
  reader.onload = (ev) => {
    try {
      let rows;
      if (isExcel) {
        if (typeof XLSX === 'undefined') throw new Error('Excel parser did not load — try a CSV export instead');
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        rows = dfsRowsFromAOA(XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' }));
      } else {
        rows = dfsParseCSV(ev.target.result);
      }
      dfsIngestRows(rows);
    } catch (err) {
      statusEl.innerHTML = `<span style="color:var(--red)">Failed to parse file: ${err.message}</span>`;
    }
  };
  if (isExcel) reader.readAsArrayBuffer(file); else reader.readAsText(file);
}

function dfsIngestRows(rows) {
  const statusEl = document.getElementById('dfsUploadStatus');
  const flexRows = rows.filter(r => (r['Roster Position'] || '').toUpperCase() === 'FLEX');
  if (!flexRows.length) { statusEl.innerHTML = `<span style="color:var(--red)">No FLEX rows found — is this a DK Showdown salary file?</span>`; return; }
  const gameInfo = rows[0]['Game Info'] || '';
  const m = gameInfo.match(/^(\w+)@(\w+)\s+(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (!m) { statusEl.innerHTML = `<span style="color:var(--red)">Couldn't read the matchup from the Game Info column</span>`; return; }
  dfsState.players = flexRows.map(r => ({
    id: r.ID, position: r.Position, name: r.Name, salary: Number(r.Salary) || 0,
    teamAbbrev: r.TeamAbbrev, avgPointsPerGame: Number(r.AvgPointsPerGame) || 0, status: r.Status || '',
  }));
  dfsState.awayAbbr = m[1]; dfsState.homeAbbr = m[2]; dfsState.year = m[5];
  dfsState.locked = new Set(); dfsState.captainLock = null; dfsState.excluded = new Set(); dfsState.lastResult = null;
  renderDfsPlayerTable();
}

function dfsResetUpload() {
  dfsState.players = []; dfsState.lastResult = null;
  loadDfsOptimizer();
}

function renderDfsPlayerTable() {
  const byPos = { QB: 1, RB: 2, WR: 3, TE: 4, K: 5, DST: 6 };
  const sorted = [...dfsState.players].sort((a, b) => (byPos[a.position] || 9) - (byPos[b.position] || 9) || b.salary - a.salary);
  const rows = sorted.map(p => {
    const locked = dfsState.locked.has(p.id);
    const isCaptain = dfsState.captainLock === p.id;
    const excluded = dfsState.excluded.has(p.id);
    return `<tr class="${excluded ? 'dfs-row-excluded' : ''}">
      <td class="td-pos">${p.position}</td>
      <td class="td-name">${p.name}</td>
      <td class="td-team">${p.teamAbbrev}</td>
      <td class="td-prob num-col">$${p.salary.toLocaleString()}</td>
      <td class="td-touch num-col">${p.avgPointsPerGame}</td>
      <td>${p.status ? `<span style="color:var(--red);font-family:var(--mono);font-size:10px">${p.status}</span>` : ''}</td>
      <td><div style="display:flex;gap:4px">
        <span class="dfs-ctrl${locked ? ' on' : ''}" data-dfs-lock="${p.id}" title="Must be in the final lineup">LOCK</span>
        <span class="dfs-ctrl dfs-ctrl-cpt${isCaptain ? ' on' : ''}" data-dfs-cpt="${p.id}" title="Force this player as Captain">CPT</span>
        <span class="dfs-ctrl dfs-ctrl-x${excluded ? ' on' : ''}" data-dfs-exclude="${p.id}" title="Never include this player">OUT</span>
      </div></td>
    </tr>`;
  }).join('');
  const lockedCount = dfsState.locked.size + (dfsState.captainLock && !dfsState.locked.has(dfsState.captainLock) ? 1 : 0);
  const overLocked = lockedCount > 6;
  document.getElementById('content').innerHTML = `
    <div class="filter-bar">
      <div style="font-family:var(--mono);font-size:12px;color:var(--t1);font-weight:600">${dfsState.awayAbbr} @ ${dfsState.homeAbbr}</div>
      <span class="filter-count">${dfsState.players.length} players loaded</span>
      <span class="dfs-link-btn" id="dfsResetLink" style="margin-left:14px">upload a different file</span>
    </div>
    <div style="font-size:10px;font-family:var(--mono);color:var(--t3);margin-bottom:12px">LOCK = must be in the lineup &nbsp;·&nbsp; CPT = force as Captain (implies LOCK) &nbsp;·&nbsp; OUT = exclude entirely</div>
    <div class="table-scroll"><table class="td-table"><thead><tr><th>Pos</th><th>Player</th><th>Team</th><th class="num-col">Salary</th><th class="num-col">Avg Pts</th><th>Status</th><th>Controls</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div style="margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div class="dfs-build-btn${overLocked ? ' disabled' : ''}" id="dfsBuildBtn">${icon('bolt')} Build Optimal Lineup</div>
      <div id="dfsBuildStatus" style="font-family:var(--mono);font-size:11px;color:${overLocked ? 'var(--red)' : 'var(--t3)'}">${overLocked ? 'Too many locked players for a 6-man roster — unlock some first' : ''}</div>
    </div>
    <div id="dfsResults" style="margin-top:20px"></div>`;
  document.getElementById('dfsResetLink').addEventListener('click', dfsResetUpload);
  document.querySelectorAll('[data-dfs-lock]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.dfsLock;
    if (dfsState.locked.has(id)) dfsState.locked.delete(id); else dfsState.locked.add(id);
    renderDfsPlayerTable();
  }));
  document.querySelectorAll('[data-dfs-cpt]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.dfsCpt;
    dfsState.captainLock = dfsState.captainLock === id ? null : id;
    if (dfsState.excluded.has(id)) dfsState.excluded.delete(id);
    renderDfsPlayerTable();
  }));
  document.querySelectorAll('[data-dfs-exclude]').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.dfsExclude;
    if (dfsState.excluded.has(id)) dfsState.excluded.delete(id);
    else { dfsState.excluded.add(id); dfsState.locked.delete(id); if (dfsState.captainLock === id) dfsState.captainLock = null; }
    renderDfsPlayerTable();
  }));
  if (!overLocked) document.getElementById('dfsBuildBtn').addEventListener('click', dfsBuildLineup);
}

async function dfsBuildLineup() {
  const statusEl = document.getElementById('dfsBuildStatus');
  statusEl.style.color = 'var(--t3)';
  statusEl.innerHTML = `<span style="display:inline-flex;align-items:center;gap:6px"><span class="spinner" style="width:12px;height:12px;margin:0"></span> Optimizing against live matchup data…</span>`;
  try {
    const payload = {
      players: dfsState.players, awayAbbr: dfsState.awayAbbr, homeAbbr: dfsState.homeAbbr, year: dfsState.year,
      lockedIds: [...dfsState.locked], captainLockId: dfsState.captainLock, excludedIds: [...dfsState.excluded],
    };
    const res = await fetch('/api/lineup-optimizer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.error) { statusEl.style.color = 'var(--red)'; statusEl.textContent = data.error; return; }
    statusEl.textContent = '';
    dfsState.lastResult = data;
    renderDfsResults(data);
  } catch (e) {
    statusEl.style.color = 'var(--red)'; statusEl.textContent = 'Request failed: ' + e.message;
  }
}

      <div class="parlay-leg-detail">$${(isCaptain ? lineup.captainSalary : p.salary).toLocaleString()}${!p.modeled ? ' · recency estimate' : ''}</div></div>

  const lineupHTML = `<div class="parlay-card">

      <div class="dfs-cap-bar"><div class="dfs-cap-fill" style="width:${(lineup.totalSalary / 50000 * 100).toFixed(1)}%"></div></div>
    </div>
    <div class="parlay-disclaimer">Model projects ${away} ${model.awayImplied} – ${home} ${model.homeImplied} (total ${model.total}${model.shootoutSignal ? ', shootout range' : ''}). This maximizes expected points under your locks — it does not account for who else in your contest is rostering the same players.</div>
  </div>`;

  const allSorted = [...players].sort((a, b) => b.points - a.points);
  const tableRows = allSorted.map(p => `<tr class="expand-row" data-dfs-detail="${p.id}">
    <td class="td-pos">${p.pos}</td><td class="td-name"><span class="expand-arrow">${icon('chevron')}</span>${p.name}</td>
    <td class="td-team">${p.team}</td><td class="td-prob num-col">${p.points.toFixed(2)}</td>
    <td class="td-touch num-col">$${p.salary.toLocaleString()}</td>
    <td class="td-touch num-col">${(p.points / (p.salary / 1000)).toFixed(2)}</td>

  document.getElementById('dfsResults').innerHTML = lineupHTML +
    `<div style="margin:18px 0 8px;font-size:11px;font-family:var(--mono);color:var(--t3)">ALL PLAYER PROJECTIONS (sorted by projected points, FLEX pricing)</div>

    <tbody>${tableRows}</tbody></table></div>`;

  const byId = {}; players.forEach(p => byId[p.id] = p);
  document.querySelectorAll('[data-dfs-detail]').forEach(el => el.addEventListener('click', () => {
    const p = byId[el.dataset.dfsDetail]; if (!p) return;
    const header = `<div class="dd-name">${p.name}</div><div class="dd-sub">${p.pos} · ${p.team} · $${p.salary.toLocaleString()}</div>`;

      <div class="detail-sig-row"><span>Source</span><span style="font-family:var(--mono);color:${p.modeled ? 'var(--teal)' : 'var(--t3)'}">${p.modeled ? 'nflprob model' : 'recency estimate'}</span></div>
      ${p.note ? `<div class="detail-sig-desc" style="margin-top:6px">${p.note}</div>` : ''}</div></div>`;
    openDrawer(header, body);
  }));
}

// ═══════════════ ACCURACY TRACKING ═══════════════
// Shows how well the model's own predictions have actually done — anytime-TD hit rate
// (overall and broken down by badge/confidence tier, since those tiers are supposed to mean
// something), yardage-prop error (MAE + bias, so systematic over/under-projection shows up),
// and game-level win/total accuracy. Backed by api/history.js + lib/grading.js, which grade
// saved weekly snapshots against real nflverse results once games are final.
function fmtPct(v) { return v == null ? '—' : v + '%'; }
function fmtNum(v) { return v == null ? '—' : v; }
function accuracyKpi(label, val, color, sub) {
  return `<div class="today-kpi"><div class="today-kpi-val" style="color:${color}">${val}</div><div class="today-kpi-lbl">${label}</div>${sub ? `<div style="font-size:9px;font-family:var(--mono);color:var(--t3);margin-top:2px">${sub}</div>` : ''}</div>`;
}

async function loadAccuracy() {
  setStatus(false);
  document.getElementById('content').innerHTML = loadingHTML('Loading accuracy history…');
  try {
    const data = await fetch('/api/history').then(r => r.json());
    if (data.error) { document.getElementById('content').innerHTML = errorHTML(data.error); return; }
    renderAccuracy(data);
  } catch (e) { document.getElementById('content').innerHTML = errorHTML(e); }
}

function renderAccuracyWeekList(records) {
  if (!records.length) return '';
  const rows = records.map(r => {
    const statusHtml = r.resultsAdded
      ? `<span style="display:inline-flex;align-items:center;gap:4px;color:var(--green);font-family:var(--mono);font-size:10px">${icon('check')} GRADED</span>`
      : `<span style="color:var(--amber);font-family:var(--mono);font-size:10px">SAVED — AWAITING RESULTS</span>`;
    return `<tr><td class="td-name">${r.week}</td><td class="td-touch">${(r.predictions || []).length} predictions</td>
      <td>${statusHtml}</td>
      <td>${r.resultsAdded ? '' : `<span class="dfs-link-btn" data-grade-week="${r.week}">grade now</span>`}</td></tr>`;
  }).join('');
  return `<div style="margin:18px 0 8px;font-size:11px;font-family:var(--mono);color:var(--t3)">TRACKED WEEKS</div>
    <div class="table-scroll"><table class="td-table"><thead><tr><th>Week</th><th>Predictions</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function renderAccuracy(data) {
  const agg = data.aggregate;
  const records = data.records || [];
  const headerHTML = `<div class="filter-bar"><div style="font-family:var(--mono);font-size:12px;color:var(--t3)">Predictions snapshot automatically from the Slate tab before kickoff each week.</div>
    <span class="dfs-link-btn" id="accSnapshotBtn" style="margin-left:auto">snapshot current week now</span></div>`;

  if (!agg) {
    document.getElementById('content').innerHTML = headerHTML +
      `<div class="empty"><h3>No graded weeks yet</h3><div style="margin-top:8px;color:var(--t3);font-size:12px">Once a saved week's games are final, grade it below to start building accuracy history.</div></div>
      ${renderAccuracyWeekList(records)}`;
    attachAccuracyHandlers();
    return;
  }

  const kpis = `<div class="today-kpis">
    ${accuracyKpi('Anytime TD Hit Rate', fmtPct(agg.anytimeTd.hitRate), 'var(--teal)', agg.anytimeTd.n + ' graded')}
    ${accuracyKpi('Game Winner Accuracy', fmtPct(agg.gameWinner.hitRate), 'var(--green)', agg.gameWinner.n + ' graded')}
    ${accuracyKpi('Rush Yds MAE', fmtNum(agg.rushYds.mae), 'var(--amber)', agg.rushYds.n + ' graded · bias ' + fmtNum(agg.rushYds.bias))}
    ${accuracyKpi('Rec Yds MAE', fmtNum(agg.recYds.mae), 'var(--amber)', agg.recYds.n + ' graded · bias ' + fmtNum(agg.recYds.bias))}
    ${accuracyKpi('Pass Yds MAE', fmtNum(agg.passYds.mae), 'var(--amber)', agg.passYds.n + ' graded · bias ' + fmtNum(agg.passYds.bias))}
    ${accuracyKpi('Total Points MAE', fmtNum(agg.totalPoints.mae), 'var(--purple)', agg.totalPoints.n + ' graded · bias ' + fmtNum(agg.totalPoints.bias))}
  </div>`;

  const badgeRows = ['Elite', 'All-Star', 'Value', 'none'].map(tier => {
    const b = agg.anytimeTd.byBadge[tier];
    return `<div class="game-lean-row"><div class="game-lean-teams">${tier === 'none' ? 'No Badge' : tier}</div>
      <div class="game-lean-meta"><span>${b.n} graded</span><span style="color:var(--teal)">${fmtPct(b.hitRate)} hit rate</span></div></div>`;
  }).join('');
  const confRows = ['high', 'mid', 'low'].map(tier => {
    const b = agg.anytimeTd.byConfidence[tier];
    return `<div class="game-lean-row"><div class="game-lean-teams">${tier.toUpperCase()}</div>
      <div class="game-lean-meta"><span>${b.n} graded</span><span style="color:var(--teal)">${fmtPct(b.hitRate)} hit rate</span></div></div>`;
  }).join('');

  const mlLeanLabels = { strong: 'Strong Lean (65%+)', lean: 'Lean (57-65%)', tossup: 'Toss-up (<57%)' };
  const mlLeanRows = ['strong', 'lean', 'tossup'].map(tier => {
    const b = agg.gameWinner.byLean[tier];
    return `<div class="game-lean-row"><div class="game-lean-teams">${mlLeanLabels[tier]}</div>
      <div class="game-lean-meta"><span>${b.n} graded</span><span style="color:var(--green)">${fmtPct(b.hitRate)} hit rate</span></div></div>`;
  }).join('');
  const totalsLeanLabels = { shootout: 'Shootout (48+ proj.)', lowScoring: 'Low Scoring (≤40 proj.)', neutral: 'Neutral' };
  const totalsLeanRows = ['shootout', 'lowScoring', 'neutral'].map(tier => {
    const b = agg.totalPoints.byLean[tier];
    return `<div class="game-lean-row"><div class="game-lean-teams">${totalsLeanLabels[tier]}</div>
      <div class="game-lean-meta"><span>${b.n} graded</span><span style="color:var(--purple)">MAE ${fmtNum(b.mae)}</span><span>bias ${fmtNum(b.bias)}</span></div></div>`;
  }).join('');

  document.getElementById('content').innerHTML = headerHTML + kpis +
    `<div class="today-two-col">
      <div class="today-section"><div class="today-section-hdr"><span>Anytime TD — Hit Rate by Badge Tier</span></div><div class="today-section-body">${badgeRows}</div></div>
      <div class="today-section"><div class="today-section-hdr"><span>Anytime TD — Hit Rate by Confidence Tier</span></div><div class="today-section-body">${confRows}</div></div>
    </div>
    <div class="today-two-col">
      <div class="today-section"><div class="today-section-hdr"><span>Moneyline Lean — Hit Rate by Lean Strength</span></div><div class="today-section-body">${mlLeanRows}</div></div>
      <div class="today-section"><div class="today-section-hdr"><span>Totals Lean — Error by Signal</span></div><div class="today-section-body">${totalsLeanRows}</div></div>
    </div>
    <div class="empty" style="padding:10px 4px;text-align:left;font-size:11px">Bias is (projected − actual): positive means the model is over-projecting on average, negative under-projecting. MAE is mean absolute error in yards/points. A yardage prop "hits" when the actual result fell within the projected floor–ceiling range; game winner uses the model's own implied win probability, bucketed by how far that probability sits from a coin flip. Totals lean buckets split by the same shootout/low-scoring thresholds shown on the Slate tab's Game Leans section.</div>
    ${renderAccuracyWeekList(records)}`;
  attachAccuracyHandlers();
}

function attachAccuracyHandlers() {
  document.querySelectorAll('[data-grade-week]').forEach(el => el.addEventListener('click', async () => {
    const weekKey = el.dataset.gradeWeek;
    el.textContent = 'grading…';
    try {
      const res = await fetch('/api/history', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'results', week: weekKey }) });
      const data = await res.json();
      if (data.notReady) { el.textContent = 'not final yet — try later'; return; }
      if (data.error) { el.textContent = 'error: ' + data.error; return; }
      loadAccuracy();
    } catch (e) { el.textContent = 'request failed'; }
  }));
  const snapBtn = document.getElementById('accSnapshotBtn');
  if (snapBtn) snapBtn.addEventListener('click', async () => {
    snapBtn.textContent = 'snapshotting…';
    try {
      const [teamRes, tdRes, rushRes, recRes, passRes] = await Promise.all([
        cachedJSON('/api/team-model?week=' + week), cachedJSON('/api/props?week=' + week),
        cachedJSON('/api/rush-props?week=' + week), cachedJSON('/api/rec-props?week=' + week),
        cachedJSON('/api/pass-props?week=' + week),
      ]);
      const result = await maybeSnapshotWeek(teamRes, { td: tdRes.players || [], rush: rushRes.players || [], rec: recRes.players || [], pass: passRes.players || [] });
      if (result.ok === false) { snapBtn.textContent = 'failed: ' + result.error; return; }
      if (result.skipped) { snapBtn.textContent = 'skipped (' + result.reason + ')'; return; }
      loadAccuracy(); // reloads the whole tab, which re-fetches /api/history — the new week will now show up in Tracked Weeks instead of the page looking unchanged
    } catch (e) { snapBtn.textContent = 'failed: ' + e.message; }
  });
}

let seasonCategory = 'wins';
const seasonRawData = { wins:null, td:null, rush:null, rec:null, pass:null };
async function loadSeasonCategory(category) {
  seasonCategory = category;
  if (seasonRawData[category]) { renderSeasonProjections(seasonRawData[category]); return; }
  document.getElementById('content').innerHTML = renderSeasonPills(category) + loadingHTML('Loading season projections…');
  try { const d = await cachedJSON('/api/season?category=' + category); seasonRawData[category] = d; renderSeasonProjections(d); }
  catch (e) { document.getElementById('content').innerHTML = renderSeasonPills(category) + errorHTML(e); }
}
function renderSeasonPills(active) {
  const labels = { wins:'Team Wins', td:'TD Totals', rush:'Rushing Yds', rec:'Receiving Yds', pass:'Passing Yds' };
  return `<div class="filter-bar"><div class="pos-pills">${Object.entries(labels).map(([k,l]) => `<div class="pos-pill${active===k?' on':''}" data-season-cat="${k}">${l}</div>`).join('')}</div></div>`;
}
function renderSeasonProjections(d) {
  setStatus(d.cached);
  const pillsHTML = renderSeasonPills(d.category);
  if (d.error) { document.getElementById('content').innerHTML = pillsHTML + '<div class="empty"><h3>' + d.error + '</h3></div>'; attachSeasonPillHandlers(); return; }
  const results = d.results || [];
  if (!results.length) { document.getElementById('content').innerHTML = pillsHTML + '<div class="empty"><h3>No results found</h3></div>'; attachSeasonPillHandlers(); return; }
  let table;
  if (d.category === 'wins') {
    table = `<table class="td-table"><thead><tr><th>Team</th><th class="num-col">Record So Far</th><th class="num-col">Games Left</th><th class="num-col">Projected Total Wins</th></tr></thead>
      <tbody>${results.map((r,i)=>`<tr><td class="td-name">${i+1}. ${r.team}</td><td class="td-touch">${r.actualWins}-${r.actualLosses}</td><td class="td-touch">${r.gamesRemaining}</td><td class="td-prob">${r.projectedTotalWins}</td></tr>`).join('')}</tbody></table>`;
  } else if (d.category === 'td') {
    table = `<table class="td-table"><thead><tr><th>Player</th><th>Pos</th><th>Team</th><th class="num-col">Games Left</th><th class="num-col">Projected Season TDs</th></tr></thead>
      <tbody>${results.map((r,i)=>`<tr><td class="td-name">${i+1}. ${r.name}</td><td class="td-pos">${r.position}</td><td class="td-team">${r.team}</td><td class="td-touch">${r.gamesRemaining}</td><td class="td-prob">${r.projectedSeasonTds}</td></tr>`).join('')}</tbody></table>`;
  } else {
    const statLabel = {rush:'Rushing',rec:'Receiving',pass:'Passing'}[d.category];
    table = `<table class="td-table"><thead><tr><th>Player</th><th>Team</th><th class="num-col">Games Left</th><th class="num-col">Projected ${statLabel} Yards</th></tr></thead>
      <tbody>${results.map((r,i)=>`<tr><td class="td-name">${i+1}. ${r.name}</td><td class="td-team">${r.team}</td><td class="td-touch">${r.gamesRemaining}</td><td class="td-prob">${r.projectedSeasonYards.toLocaleString()}</td></tr>`).join('')}</tbody></table>`;
  }
  document.getElementById('content').innerHTML = pillsHTML + `<div class="table-scroll">${table}</div>`;
  attachSeasonPillHandlers();
}
function attachSeasonPillHandlers() { document.querySelectorAll('[data-season-cat]').forEach(p => p.addEventListener('click', () => loadSeasonCategory(p.dataset.seasonCat))); }

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active')); t.classList.add('active');
  currentTab = t.dataset.tab;
  if (currentTab==='week') loadThisWeek();
  else if (currentTab==='team') loadTeamModel();
  else if (currentTab==='td') loadTdProps();
  else if (currentTab==='rush') loadRushProps();
  else if (currentTab==='rec') loadRecProps();
  else if (currentTab==='pass') loadPassProps();
  else if (currentTab==='best') loadBestPlays();
  else if (currentTab==='parlay') loadParlayBuilder();
  else if (currentTab==='dfs') loadDfsOptimizer();
  else if (currentTab==='season') loadSeasonCategory(seasonCategory);
  else if (currentTab==='accuracy') loadAccuracy();
  else document.getElementById('content').innerHTML = '<div class="empty"><h3>Not built yet</h3></div>';
}));
// Ground truth for "is the week being viewed actually the upcoming/current one" — needed so
// accuracy snapshots (see buildPredictionsSnapshot below) never fire for a week the user is
// just browsing historically via ?week=, which would "predict" an already-decided game and
// silently corrupt the accuracy tracking with hindsight.
let realCurrentWeek = null;

async function initApp() {
  try {
    const current = await cachedJSON('/api/current-week');
    realCurrentWeek = current.week || null;
  } catch (e) { /* leave null — snapshot guard just stays closed */ }
  if (!week) {
    // No ?week= given explicitly — ask ESPN what the current real week actually is, instead
    // of silently defaulting to 1 forever. Falls back to 1 only if this itself fails.
    week = realCurrentWeek || 1;
  }
  document.getElementById('weekLabel').textContent = 'Week ' + week;
  loadThisWeek();
}
initApp();
</script>
