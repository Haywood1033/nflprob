<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFLProb</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--bg2:#0e1422;--bg3:#141e2e;--bd:rgba(255,255,255,0.10);--bd2:rgba(255,255,255,0.16);--t1:rgba(255,255,255,0.92);--t2:rgba(255,255,255,0.45);--t3:rgba(255,255,255,0.25);--teal:#2dd4bf;--green:#4ade80;--amber:#f59e0b;--red:#f87171;--purple:#a78bfa;--blue:#60a5fa;--mono:'Space Mono',monospace;--sans:'DM Sans',system-ui,sans-serif;--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:14px;min-height:100vh;overflow-x:hidden}

.hdr{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:0.5px solid var(--bd);background:var(--bg);position:sticky;top:0;z-index:100}
.logo{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--t1);letter-spacing:-0.3px}
.hdr-week{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.18);padding:4px 10px;border-radius:20px;letter-spacing:0.02em}
.status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t3);margin-left:auto;font-family:var(--mono)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}

.tabs{display:flex;gap:6px;padding:10px 18px;border-bottom:0.5px solid rgba(255,255,255,0.08);background:var(--bg);overflow-x:auto;scrollbar-width:none}
.tab{padding:6px 14px;font-size:11px;font-weight:500;cursor:pointer;border-radius:20px;color:rgba(255,255,255,0.45);transition:all .15s;white-space:nowrap;border:0.5px solid transparent;font-family:var(--mono)}
.tab.active{color:var(--green);background:rgba(74,222,128,0.1);border-color:rgba(74,222,128,0.25)}

.wrap{padding:16px 20px}
.gc{background:var(--bg2);border:0.5px solid rgba(255,255,255,0.11);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.gch{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:0.5px solid var(--bd);background:var(--bg3)}
.gctime{font-family:var(--mono);font-size:11px;color:var(--t3)}
.gbody{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px;padding:16px 18px}
.sl{font-size:11px;font-family:var(--mono);color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.sv{font-size:22px;font-family:var(--mono);font-weight:700;color:var(--t1);line-height:1.2}
.sv.teal{color:var(--teal)}
.badge-shootout{font-size:9px;font-family:var(--mono);padding:2px 6px;border-radius:3px;background:rgba(245,158,11,.1);color:var(--amber);border:1px solid rgba(245,158,11,.25)}
.badge-lowscore{font-size:9px;font-family:var(--mono);padding:2px 6px;border-radius:3px;background:rgba(96,165,250,.1);color:var(--blue);border:1px solid rgba(96,165,250,.25)}
.empty{text-align:center;padding:40px 20px;color:var(--t3)}
.empty h3{font-size:15px;color:var(--t2);margin-bottom:8px}

.td-table{width:100%;border-collapse:collapse;font-size:13px}
.td-table thead th{text-align:left;padding:9px 12px;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;border-bottom:0.5px solid var(--bd);background:var(--bg2)}
.td-table tbody td{padding:10px 12px;border-bottom:0.5px solid var(--bd)}
.td-table tbody tr:hover{background:var(--bg2)}
.td-name{font-weight:600;color:var(--t1)}
.td-pos{font-family:var(--mono);font-size:11px;color:var(--t3)}
.td-team{font-size:12px;color:var(--t2)}
.td-prob{font-family:var(--mono);font-weight:700;color:var(--teal)}
.td-touch{font-family:var(--mono);font-size:12px;color:var(--t3)}

.game-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-bottom:16px;scrollbar-width:thin}
.gs-card{flex-shrink:0;width:180px;background:var(--bg2);border:0.5px solid rgba(255,255,255,0.11);border-radius:8px;padding:10px 12px;cursor:pointer;transition:border-color .15s}
.gs-card:hover{border-color:var(--teal)}
.gs-card.high-scoring{border-color:rgba(245,158,11,.3)}
.gs-status{font-size:9px;font-family:var(--mono);color:var(--t3);margin-bottom:6px}
.gs-team{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.gs-team-name{font-size:12px;font-weight:600;color:var(--t1)}
.gs-team-td{font-size:10px;font-family:var(--mono);color:var(--teal)}
.gs-divider{height:1px;background:var(--bd);margin:6px 0}
.gs-total{display:flex;justify-content:space-between;align-items:baseline}
.gs-total-pts{font-size:16px;font-weight:700;font-family:var(--mono)}
.gs-meta{font-size:9px;font-family:var(--mono);color:var(--t3)}

.today-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.today-kpi{background:var(--bg2);border:0.5px solid rgba(255,255,255,0.11);border-radius:8px;padding:12px 14px}
.today-kpi-val{font-size:22px;font-weight:700;font-family:var(--mono);line-height:1.1}
.today-kpi-lbl{font-size:10px;font-family:var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

.today-section{background:var(--bg2);border:0.5px solid rgba(255,255,255,0.11);border-radius:8px;margin-bottom:14px;overflow:hidden}
.today-section-hdr{padding:12px 16px;border-bottom:0.5px solid var(--bd);font-size:10px;font-family:var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center}
.today-section-body{padding:14px 16px}
.today-target{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--bg3)}
.today-target:last-child{border-bottom:none}
.today-target-rank{font-size:11px;font-family:var(--mono);color:var(--t3);width:18px;flex-shrink:0}
.today-target-name{font-size:13px;font-weight:600;color:var(--t1)}
.today-target-sub{font-size:10px;font-family:var(--mono);color:var(--t3);margin-top:1px}
.today-target-prob{font-size:14px;font-family:var(--mono);font-weight:700;flex-shrink:0}
.today-two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.today-two-col{grid-template-columns:1fr}}

.best-play-card{background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);border:0.5px solid rgba(245,158,11,.25);border-radius:8px;padding:16px;margin-bottom:16px;cursor:pointer}
.best-play-hdr{font-size:10px;font-family:var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;display:flex;justify-content:space-between}
.best-play-name{font-size:19px;font-weight:700;color:var(--t1);margin-bottom:2px}
.best-play-sub{font-size:11px;font-family:var(--mono);color:var(--t3);margin-bottom:10px}
.best-play-prob{font-size:38px;font-weight:700;font-family:var(--mono);color:var(--amber);line-height:1}
.best-play-badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:3px 9px;border-radius:4px;margin-top:8px;display:inline-block}
.game-lean-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bg3);font-size:12px}
.game-lean-row:last-child{border-bottom:none}
.game-lean-teams{font-weight:600;color:var(--t1)}
.game-lean-meta{display:flex;gap:14px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--t3)}

.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.matchup-select{background:var(--bg2);border:0.5px solid rgba(255,255,255,0.16);border-radius:6px;color:var(--t1);font-family:var(--mono);font-size:12px;padding:7px 12px;cursor:pointer;min-width:200px}
.matchup-select:focus{outline:none;border-color:var(--teal)}
.pos-pills{display:flex;gap:6px}
.pos-pill{padding:6px 13px;font-size:11px;font-weight:600;cursor:pointer;border-radius:20px;color:var(--t3);border:0.5px solid rgba(255,255,255,0.14);font-family:var(--mono);transition:all .15s;background:transparent}
.pos-pill.on{color:var(--teal);background:rgba(45,212,191,.1);border-color:rgba(45,212,191,.3)}
.filter-count{font-size:11px;font-family:var(--mono);color:var(--t3);margin-left:auto}

.slate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.slate-card{background:var(--bg2);border:0.5px solid rgba(255,255,255,0.11);border-radius:10px;overflow:hidden;transition:border-color .15s;cursor:pointer}
.slate-card:hover{border-color:rgba(45,212,191,.3)}
.slate-card.shootout{border-color:rgba(245,158,11,.3)}
.slate-hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg3);border-bottom:0.5px solid var(--bd)}
.slate-weather{font-size:10px;font-family:var(--mono);color:var(--t3);display:flex;align-items:center;gap:5px}
.slate-matchup{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px}
.slate-team{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.slate-logo{width:48px;height:48px;object-fit:contain}
.slate-team-name{font-size:11px;font-weight:600;color:var(--t1);text-align:center}
.slate-team-implied{font-size:24px;font-weight:700;font-family:var(--mono);color:var(--t1)}
.slate-vs{font-size:10px;font-family:var(--mono);color:var(--t3);padding:0 8px}
.slate-meta-row{display:flex;align-items:center;padding:10px 14px;border-top:0.5px solid var(--bg3);border-bottom:0.5px solid var(--bg3)}
.slate-meta-item{flex:1;text-align:center}
.slate-meta-item.center{flex:0 0 auto;padding:0 14px}
.slate-meta-val{font-size:14px;font-weight:700;font-family:var(--mono);color:var(--teal)}
.slate-meta-lbl{font-size:9px;font-family:var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.slate-targets{padding:10px 14px}
.slate-target-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:4px 0}
.slate-target-lbl{color:var(--t3);font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em}
.slate-target-val{color:var(--t1);font-weight:600}
.slate-target-prob{color:var(--teal);font-family:var(--mono);font-weight:700}
.slate-top-prop{padding:10px 14px;background:rgba(167,139,250,.06);border-top:0.5px solid var(--bg3)}
.slate-top-prop-lbl{font-size:9px;font-family:var(--mono);color:var(--purple);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}

.slate-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(2px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.slate-modal{background:var(--bg2);border:0.5px solid rgba(255,255,255,0.18);border-radius:12px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.5);position:relative}
.slate-modal-close{position:absolute;top:14px;right:16px;font-size:20px;color:var(--t3);cursor:pointer;line-height:1;padding:4px}
.slate-modal-close:hover{color:var(--t1)}
.slate-modal .slate-matchup{padding:24px 24px 16px}
.slate-modal .slate-logo{width:64px;height:64px}
.slate-modal .slate-team-implied{font-size:32px}
.slate-modal-section{padding:12px 20px}
.slate-modal-section-hdr{font-size:10px;font-family:var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}

/* ── BEST PLAYS tab ── */
.best-list{display:flex;flex-direction:column;gap:8px}
.best-row{background:var(--bg2);border:0.5px solid rgba(255,255,255,0.11);border-radius:8px;padding:12px 16px}
.best-row-top{display:flex;align-items:center;gap:14px;cursor:pointer}
.best-row.elite{border-color:rgba(245,158,11,.3)}
.best-row.allstar{border-color:rgba(96,165,250,.3)}
.best-rank{font-family:var(--mono);font-size:13px;color:var(--t3);width:22px;flex-shrink:0;text-align:center}
.best-type-tag{font-family:var(--mono);font-size:9px;font-weight:700;padding:3px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;width:44px;text-align:center}
.best-type-td{background:rgba(74,222,128,.1);color:var(--green);border:1px solid rgba(74,222,128,.25)}
.best-type-rush{background:rgba(45,212,191,.1);color:var(--teal);border:1px solid rgba(45,212,191,.25)}
.best-type-rec{background:rgba(167,139,250,.1);color:var(--purple);border:1px solid rgba(167,139,250,.25)}
.best-type-pass{background:rgba(96,165,250,.1);color:var(--blue);border:1px solid rgba(96,165,250,.25)}
.best-info{flex:1;min-width:0}
.best-name{font-size:14px;font-weight:600;color:var(--t1)}
.best-sub{font-size:11px;font-family:var(--mono);color:var(--t3);margin-top:1px}
.best-value{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--teal);flex-shrink:0;text-align:right;min-width:70px}
.best-badge{font-family:var(--mono);font-size:9px;font-weight:700;flex-shrink:0;text-align:right;min-width:90px}

/* ── Signal chips: show individual flags, not just composite badge ── */
.sig-chips{display:flex;gap:4px;flex-wrap:wrap;max-width:180px}
.sig-chip{font-family:var(--mono);font-size:8px;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap;letter-spacing:.02em}
.sig-chip.on{background:rgba(45,212,191,.12);color:var(--teal);border:1px solid rgba(45,212,191,.3)}
.sig-chip.off{background:rgba(255,255,255,.03);color:var(--t3);border:1px solid rgba(255,255,255,.08)}

.sig-filter-pills{display:flex;gap:6px;flex-wrap:wrap}
.sig-filter-pill{padding:5px 11px;font-size:10px;font-weight:600;cursor:pointer;border-radius:14px;color:var(--t3);border:0.5px solid rgba(255,255,255,0.14);font-family:var(--mono);transition:all .15s;background:transparent}
.sig-filter-pill.on{color:var(--purple);background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.3)}

.expand-row{cursor:pointer}
.expand-row:hover{background:var(--bg2)}
.expand-arrow{display:inline-block;font-size:9px;color:var(--t3);margin-right:6px;transition:transform .15s}
.expand-arrow.open{transform:rotate(90deg)}
.detail-row td{background:var(--bg3);padding:14px 20px !important;border-bottom:0.5px solid var(--bd)}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.detail-block-hdr{font-size:9px;font-family:var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.detail-sig-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px}
.detail-sig-desc{font-size:10px;color:var(--t3);font-family:var(--mono)}

.best-expand{margin-top:8px;padding-top:10px;border-top:0.5px solid var(--bg3);display:none}
.best-expand.open{display:block}
.best-row-clickable{cursor:pointer}
</style>
</head>
<body>
  <div class="hdr">
    <div class="logo">NFLPROB</div>
    <div class="hdr-week" id="weekLabel">Week —</div>
    <div class="status"><span class="dot live"></span><span id="statusText">Loading…</span></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="week">This Week</div>
    <div class="tab" data-tab="team">Slate</div>
    <div class="tab" data-tab="td">Anytime TD</div>
    <div class="tab" data-tab="rush">Rushing Yds</div>
    <div class="tab" data-tab="rec">Receiving Yds</div>
    <div class="tab" data-tab="pass">Passing Yds</div>
    <div class="tab" data-tab="best">Best Plays</div>
    <div class="tab" data-tab="season">Season Projections</div>
    <div class="tab" data-tab="accuracy">Accuracy</div>
  </div>

  <div class="wrap" id="content">
    <div class="empty"><h3>Loading this week's slate…</h3></div>
  </div>

<script>
const params = new URLSearchParams(location.search);
const week = params.get('week') || 1;
document.getElementById('weekLabel').textContent = 'Week ' + week;

let currentTab = 'week';

const rawData = { td: null, rush: null, rec: null, pass: null };
const filterState = {
  td:   { matchup: 'all', position: 'all', signal: 'all' },
  rush: { matchup: 'all', signal: 'all' },
  rec:  { matchup: 'all', signal: 'all' },
  pass: { matchup: 'all', signal: 'all' },
};

const TAB_SIGNALS = {
  td:   ['High Usage', 'Favorable Matchup', 'Hot Streak', 'Shootout Game', 'Featured Role', 'Sample Confidence'],
  rush: ['High Usage', 'Favorable Matchup', 'Hot Streak', 'Bellcow Volume', 'Sample Confidence'],
  rec:  ['High Usage', 'Favorable Matchup', 'Hot Streak', 'Featured Target', 'Sample Confidence'],
  pass: ['High Volume', 'Favorable Matchup', 'Hot Streak', 'Pass-Heavy Script', 'Sample Confidence'],
};

function matchupKey(p) {
  return [p.team, p.opponent].sort().join(' vs ');
}

function buildMatchupOptions(players) {
  const seen = new Set();
  const options = [];
  for (const p of players) {
    const key = matchupKey(p);
    if (!seen.has(key)) { seen.add(key); options.push(key); }
  }
  return options.sort();
}

function hasActiveSignal(p, label) {
  return !!(p.signals && p.signals.some(s => s.label === label && s.active));
}

function filterPlayers(players, matchup, position, signal) {
  return players.filter(p => {
    if (matchup !== 'all' && matchupKey(p) !== matchup) return false;
    if (position && position !== 'all' && p.position !== position) return false;
    if (signal && signal !== 'all' && !hasActiveSignal(p, signal)) return false;
    return true;
  });
}

function renderMatchupSelect(tab, players) {
  const options = buildMatchupOptions(players);
  const current = filterState[tab].matchup;
  return `<select class="matchup-select" id="matchupSelect-${tab}">
    <option value="all"${current === 'all' ? ' selected' : ''}>All Games</option>
    ${options.map(o => `<option value="${o}"${current === o ? ' selected' : ''}>${o}</option>`).join('')}
  </select>`;
}

function renderPositionPills(tab, positions) {
  const current = filterState[tab].position;
  return `<div class="pos-pills">
    <div class="pos-pill${current === 'all' ? ' on' : ''}" data-pos="all" data-tab="${tab}">All</div>
    ${positions.map(pos => `<div class="pos-pill${current === pos ? ' on' : ''}" data-pos="${pos}" data-tab="${tab}">${pos}</div>`).join('')}
  </div>`;
}

function attachFilterHandlers(tab, rerenderFn) {
  const select = document.getElementById('matchupSelect-' + tab);
  if (select) {
    select.addEventListener('change', () => {
      filterState[tab].matchup = select.value;
      rerenderFn(rawData[tab]);
    });
  }
  document.querySelectorAll(`.pos-pill[data-tab="${tab}"]`).forEach(pill => {
    pill.addEventListener('click', () => {
      filterState[tab].position = pill.dataset.pos;
      rerenderFn(rawData[tab]);
    });
  });
}

async function loadThisWeek() {
  document.getElementById('content').innerHTML = '<div class="empty"><h3>Loading this week\u2019s slate…</h3></div>';
  try {
    const [teamRes, propsRes] = await Promise.all([
      fetch('/api/team-model?week=' + week).then(r => r.json()),
      fetch('/api/props?week=' + week).then(r => r.json()),
    ]);
    renderThisWeek(teamRes, propsRes);
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="empty"><h3>Failed to load</h3><div>' + e.message + '</div></div>';
  }
}

function renderThisWeek(teamData, propsData) {
  document.getElementById('statusText').textContent = (teamData.cached || propsData.cached) ? 'Cached' : 'Live';
  const games = teamData.games || [];
  const players = propsData.players || [];

  if (!games.length) {
    document.getElementById('content').innerHTML = '<div class="empty"><h3>No games found for week ' + (teamData.week || week) + '</h3></div>';
    return;
  }

  const stripHTML = '<div class="game-strip">' + games.map(g => {
    const m = g.model || {};
    const awayTop = players.filter(p => p.team === g.awayTeam).sort((a,b)=>b.prob-a.prob)[0];
    const homeTop = players.filter(p => p.team === g.homeTeam).sort((a,b)=>b.prob-a.prob)[0];
    const isHigh = m.shootoutSignal;
    const tc = m.shootoutSignal ? 'var(--amber)' : m.lowScoringSignal ? 'var(--blue)' : 'var(--t1)';
    const lean = m.shootoutSignal ? '🔥 Shootout' : m.lowScoringSignal ? '🛡 Low Scoring' : '';
    return `<div class="gs-card${isHigh ? ' high-scoring' : ''}">
      <div class="gs-status">${lean}</div>
      <div class="gs-team">
        <span class="gs-team-name">${g.awayTeam}</span>
        ${awayTop ? `<span class="gs-team-td">${awayTop.prob}% ${awayTop.name.split(' ').pop()}</span>` : ''}
      </div>
      <div class="gs-team">
        <span class="gs-team-name">${g.homeTeam}</span>
        ${homeTop ? `<span class="gs-team-td">${homeTop.prob}% ${homeTop.name.split(' ').pop()}</span>` : ''}
      </div>
      <div class="gs-divider"></div>
      <div class="gs-total">
        <span class="gs-total-pts" style="color:${tc}">${m.total ?? '—'}</span>
        <span class="gs-meta">proj total</span>
      </div>
    </div>`;
  }).join('') + '</div>';

  const shootoutCount = games.filter(g => g.model?.shootoutSignal).length;
  const eliteCount = players.filter(p => p.badge?.label.includes('Elite')).length;
  const signalPlays = players.filter(p => p.signalCount >= 3);
  const kpiHTML = `<div class="today-kpis">
    <div class="today-kpi"><div class="today-kpi-val" style="color:var(--teal)">${games.length}</div><div class="today-kpi-lbl">Games</div></div>
    <div class="today-kpi"><div class="today-kpi-val" style="color:var(--amber)">${shootoutCount}</div><div class="today-kpi-lbl">Shootouts</div></div>
    <div class="today-kpi"><div class="today-kpi-val" style="color:var(--purple)">${signalPlays.length}</div><div class="today-kpi-lbl">Signal Plays</div></div>
    <div class="today-kpi"><div class="today-kpi-val" style="color:var(--green)">${eliteCount}</div><div class="today-kpi-lbl">Elite Plays</div></div>
  </div>`;

  const scorePlayer = (p) => p.prob * 3 + p.signalCount * 5;
  const best = players.length ? [...players].sort((a,b) => scorePlayer(b) - scorePlayer(a))[0] : null;

  const bestHTML = best ? `<div class="best-play-card">
    <div class="best-play-hdr"><span>⚡ Best Play This Week</span><span>Composite signal + probability score</span></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div class="best-play-name">${best.name}</div>
        <div class="best-play-sub">${best.position} · ${best.team} vs ${best.opponent}</div>
        ${best.badge ? `<span class="best-play-badge" style="color:${best.badge.color};background:transparent;border:1px solid ${best.badge.color}66">${best.badge.label}</span>` : ''}
      </div>
      <div style="text-align:right">
        <div class="best-play-prob">${best.prob}%</div>
        <div class="gs-meta">Anytime TD</div>
      </div>
    </div>
  </div>` : '';

  const top5 = [...players].sort((a,b)=>b.prob-a.prob).slice(0,5);
  const top5HTML = top5.map((p,i) => `<div class="today-target">
    <div class="today-target-rank">${i+1}</div>
    <div style="flex:1">
      <div class="today-target-name">${p.name}</div>
      <div class="today-target-sub">${p.team} vs ${p.opponent}</div>
    </div>
    <div class="today-target-prob" style="color:var(--teal)">${p.prob}%</div>
  </div>`).join('') || '<div class="gs-meta" style="padding:8px 0">No data</div>';

  const topSignals = [...signalPlays].sort((a,b) => b.signalCount !== a.signalCount ? b.signalCount - a.signalCount : b.prob - a.prob).slice(0,5);
  const signalHTML = topSignals.map(p => `<div class="today-target">
    <div style="flex:1">
      <div class="today-target-name">${p.name}</div>
      <div class="today-target-sub">${p.team} vs ${p.opponent}</div>
    </div>
    <div style="text-align:right">
      <div class="today-target-prob" style="color:var(--teal)">${p.prob}%</div>
      ${p.badge ? `<div style="font-size:8px;font-family:var(--mono);font-weight:700;color:${p.badge.color};margin-top:2px">${p.badge.label}</div>` : ''}
    </div>
  </div>`).join('') || '<div class="gs-meta" style="padding:8px 0">No signal plays this week</div>';

  const leansHTML = games.map(g => {
    const m = g.model || {};
    const lean = m.shootoutSignal ? '🔥 Shootout' : m.lowScoringSignal ? '🛡 Low Scoring' : '';
    return `<div class="game-lean-row">
      <div class="game-lean-teams">${g.awayTeam} @ ${g.homeTeam}</div>
      <div class="game-lean-meta">
        <span>${g.awayTeam} ${m.awayImplied ?? '—'}</span>
        <span>${g.homeTeam} ${m.homeImplied ?? '—'}</span>
        <span style="color:var(--teal)">Total ${m.total ?? '—'}</span>
        <span>${g.homeTeam} ${m.homeWinProb ?? '—'}% ML</span>
        ${lean ? `<span>${lean}</span>` : ''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML =
    stripHTML + kpiHTML + bestHTML +
    `<div class="today-two-col">
      <div class="today-section"><div class="today-section-hdr"><span>Top TD Targets</span></div><div class="today-section-body">${top5HTML}</div></div>
      <div class="today-section"><div class="today-section-hdr"><span>Top Signal Plays</span></div><div class="today-section-body">${signalHTML}</div></div>
    </div>
    <div class="today-section"><div class="today-section-hdr"><span>Game Leans</span></div><div class="today-section-body">${leansHTML}</div></div>`;
}

async function loadTeamModel() {
  document.getElementById('content').innerHTML = '<div class="empty"><h3>Loading slate…</h3></div>';
  try {
    const [teamRes, tdRes, rushRes, recRes, passRes] = await Promise.all([
      fetch('/api/team-model?week=' + week).then(r => r.json()),
      fetch('/api/props?week=' + week).then(r => r.json()),
      fetch('/api/rush-props?week=' + week).then(r => r.json()),
      fetch('/api/rec-props?week=' + week).then(r => r.json()),
      fetch('/api/pass-props?week=' + week).then(r => r.json()),
    ]);
    renderTeamModel(teamRes, {
      td: tdRes.players || [], rush: rushRes.players || [],
      rec: recRes.players || [], pass: passRes.players || [],
    });
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="empty"><h3>Failed to load</h3><div>' + e.message + '</div></div>';
  }
}

async function loadTdProps() {
  document.getElementById('content').innerHTML = '<div class="empty"><h3>Loading Anytime TD model…</h3></div>';
  try {
    const r = await fetch('/api/props?week=' + week);
    const d = await r.json();
    rawData.td = d;
    renderTdProps(d);
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="empty"><h3>Failed to load</h3><div>' + e.message + '</div></div>';
  }
}

// Short codes for signal labels so chips fit in a table cell — full label still shows on hover.
const SIGNAL_ABBR = {
  'High Usage': 'USE', 'High Volume': 'VOL', 'Favorable Matchup': 'MATCH',
  'Hot Streak': 'HOT', 'Shootout Game': 'SHOOT', 'Featured Role': 'ROLE',
  'Sample Confidence': 'CONF', 'Bellcow Volume': 'BCOW', 'Featured Target': 'TGT',
  'Pass-Heavy Script': 'SCRIPT',
};

// Generic descriptions for the expanded detail panel — approximate, since the exact
// numeric threshold for the same label differs slightly by prop type (e.g. "High Usage"
// means ≥12 carries/gm for TD-RB but ≥14 for the Rushing tab). Good enough for "what is
// this signal roughly checking," not meant to restate the exact formula.
const SIGNAL_DESC = {
  'High Usage': 'Meaningful volume — carries or targets per game above the position baseline',
  'High Volume': 'Pass attempts per game above the starter baseline',
  'Favorable Matchup': 'Opponent has recently allowed more than the league-average rate to this position/stat',
  'Hot Streak': 'Strong performance in this exact stat in 2+ of the last 3 games',
  'Shootout Game': "This week's projected game total is 48+ points",
  'Featured Role': 'Has scored a rushing TD (RB) or has an elevated target share (WR/TE)',
  'Sample Confidence': 'Enough recent touches/targets/attempts that the read is not just small-sample noise',
  'Bellcow Volume': "This week's projected carries are 16+",
  'Featured Target': "This week's projected targets are 8+",
  'Pass-Heavy Script': "This week's projected pass attempts are 36+",
};

// Tracks which rows are expanded per tab, keyed by "name|team" — persists across re-renders
// within a tab (e.g. when a filter changes) so expanding a row doesn't collapse on refilter.
const expandedKeys = { td: new Set(), rush: new Set(), rec: new Set(), pass: new Set(), best: new Set() };

function rowKey(p) { return p.name + '|' + p.team; }

function toggleExpand(tab, key, rerenderFn) {
  const set = expandedKeys[tab];
  if (set.has(key)) set.delete(key); else set.add(key);
  rerenderFn();
}

function signalFilterPillsHTML(tab, signalLabels, activeSignal) {
  return `<div class="sig-filter-pills">
    <div class="sig-filter-pill${activeSignal === 'all' ? ' on' : ''}" data-sigfilter-tab="${tab}" data-sigfilter="all">All Signals</div>
    ${signalLabels.map(label => `<div class="sig-filter-pill${activeSignal === label ? ' on' : ''}" data-sigfilter-tab="${tab}" data-sigfilter="${label}">${SIGNAL_ABBR[label] || label}</div>`).join('')}
  </div>`;
}

function attachSignalFilterHandlers(tab, onPick) {
  document.querySelectorAll(`.sig-filter-pill[data-sigfilter-tab="${tab}"]`).forEach(pill => {
    pill.addEventListener('click', () => onPick(pill.dataset.sigfilter));
  });
}

function signalDetailListHTML(signals) {
  if (!signals || !signals.length) return '<div class="gs-meta">No signal data</div>';
  return signals.map(s => `<div class="detail-sig-row">
    <span style="color:${s.active ? 'var(--teal)' : 'var(--t3)'}">${s.active ? '✓' : '✗'} ${s.label}</span>
  </div><div class="detail-sig-desc" style="margin-bottom:6px">${SIGNAL_DESC[s.label] || ''}</div>`).join('');
}

function signalChipsHTML(signals) {
  if (!signals || !signals.length) return '<span style="color:var(--t3);font-size:10px">—</span>';
  return `<div class="sig-chips">${signals.map(s =>
    `<span class="sig-chip ${s.active ? 'on' : 'off'}" title="${s.label}${s.active ? ' — active' : ' — not met'}">${SIGNAL_ABBR[s.label] || s.label}</span>`
  ).join('')}</div>`;
}

function espnLogoUrl(abbr) {
  return abbr ? `https://a.espncdn.com/i/teamlogos/nfl/500/${abbr.toLowerCase()}.png` : '';
}

function weatherLabel(w) {
  if (!w || !Object.keys(w).length) return '';
  if (w.dome) return '🏟 Dome';
  const parts = [];
  if (w.t != null) parts.push(w.t + '°F');
  if (w.w != null) parts.push(w.w + 'mph' + (w.c ? ' ' + w.c : ''));
  if (w.s) parts.push(w.s);
  return parts.join(' · ');
}

let slateGames = [];

function renderTeamModel(d, props) {
  document.getElementById('statusText').textContent = d.cached ? 'Cached' : 'Live';
  const games = d.games || [];
  if (!games.length) {
    document.getElementById('content').innerHTML = '<div class="empty"><h3>No games found for week ' + d.week + '</h3></div>';
    return;
  }

  slateGames = games.map(g => {
    const m = g.model || {};
    const gameTeams = [g.homeTeam, g.awayTeam];

    const homeTd = props.td.filter(p => p.team === g.homeTeam).sort((a, b) => b.prob - a.prob);
    const awayTd = props.td.filter(p => p.team === g.awayTeam).sort((a, b) => b.prob - a.prob);
    const gameTop = [homeTd[0], awayTd[0]].filter(Boolean).sort((a, b) => b.prob - a.prob)[0];

    const rushC = props.rush.filter(p => gameTeams.includes(p.team)).map(p => ({ ...p, statLabel: 'Rushing Yds', value: p.projected }));
    const recC  = props.rec.filter(p => gameTeams.includes(p.team)).map(p => ({ ...p, statLabel: 'Receiving Yds', value: p.projected }));
    const passC = props.pass.filter(p => gameTeams.includes(p.team)).map(p => ({ ...p, statLabel: 'Passing Yds', value: p.projected }));
    const allProps = [...rushC, ...recC, ...passC].sort((a, b) => b.value - a.value);

    return { g, m, homeTd, awayTd, gameTop, allProps, weatherText: weatherLabel(g.weather) };
  });

  const cards = slateGames.map((sg, i) => {
    const { g, m, homeTd, awayTd, gameTop, allProps, weatherText } = sg;
    const isShootout = m.shootoutSignal;
    const topProp = allProps[0];

    return `<div class="slate-card${isShootout ? ' shootout' : ''}" data-slate-idx="${i}">
      <div class="slate-hdr">
        <div class="slate-weather">${weatherText ? '🌤 ' + weatherText : ''}</div>
        <div>${isShootout ? '<span class="badge-shootout">🔥 Shootout</span>' : m.lowScoringSignal ? '<span class="badge-lowscore">🛡 Low Scoring</span>' : ''}</div>
      </div>
      <div class="slate-matchup">
        <div class="slate-team">
          <img class="slate-logo" src="${espnLogoUrl(g.awayAbbr)}" alt="${g.awayTeam}" onerror="this.style.visibility='hidden'">
          <div class="slate-team-name">${g.awayTeam}</div>
          <div class="slate-team-implied">${m.awayImplied ?? '—'}</div>
        </div>
        <div class="slate-vs">@</div>
        <div class="slate-team">
          <img class="slate-logo" src="${espnLogoUrl(g.homeAbbr)}" alt="${g.homeTeam}" onerror="this.style.visibility='hidden'">
          <div class="slate-team-name">${g.homeTeam}</div>
          <div class="slate-team-implied">${m.homeImplied ?? '—'}</div>
        </div>
      </div>
      <div class="slate-meta-row">
        <div class="slate-meta-item"><div class="slate-meta-val">${m.awayWinProb ?? '—'}%</div><div class="slate-meta-lbl">${g.awayTeam} Win</div></div>
        <div class="slate-meta-item center"><div class="slate-meta-val">${m.total ?? '—'}</div><div class="slate-meta-lbl">Total</div></div>
        <div class="slate-meta-item"><div class="slate-meta-val">${m.homeWinProb ?? '—'}%</div><div class="slate-meta-lbl">${g.homeTeam} Win</div></div>
      </div>
      <div class="slate-targets">
        ${gameTop ? `<div class="slate-target-row"><span class="slate-target-lbl">Top Target</span><span class="slate-target-val">${gameTop.name}</span><span class="slate-target-prob">${gameTop.prob}%</span></div>` : ''}
        ${awayTd[0] ? `<div class="slate-target-row"><span class="slate-target-lbl">${g.awayTeam} TD</span><span class="slate-target-val">${awayTd[0].name}</span><span class="slate-target-prob">${awayTd[0].prob}%</span></div>` : ''}
        ${homeTd[0] ? `<div class="slate-target-row"><span class="slate-target-lbl">${g.homeTeam} TD</span><span class="slate-target-val">${homeTd[0].name}</span><span class="slate-target-prob">${homeTd[0].prob}%</span></div>` : ''}
      </div>
      ${topProp ? `<div class="slate-top-prop">
        <div class="slate-top-prop-lbl">Top Prop Projection</div>
        <div class="slate-target-row"><span class="slate-target-val">${topProp.name} — ${topProp.statLabel}</span><span class="slate-target-prob">${topProp.value}</span></div>
      </div>` : ''}
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = '<div class="slate-grid">' + cards + '</div>';

  document.querySelectorAll('.slate-card').forEach(card => {
    card.addEventListener('click', () => openSlateModal(Number(card.dataset.slateIdx)));
  });
}

function openSlateModal(idx) {
  closeSlateModal();
  const sg = slateGames[idx];
  if (!sg) return;
  const { g, m, homeTd, awayTd, allProps, weatherText } = sg;
  const isShootout = m.shootoutSignal;

  const top3Row = (p) => `<div class="slate-target-row"><span class="slate-target-val">${p.name} <span style="color:var(--t3)">(${p.position || p.team})</span></span><span class="slate-target-prob">${p.prob}%</span></div>`;
  const propRow = (p) => `<div class="slate-target-row"><span class="slate-target-val">${p.name} — ${p.statLabel}</span><span class="slate-target-prob">${p.value}</span></div>`;

  const overlay = document.createElement('div');
  overlay.className = 'slate-overlay';
  overlay.innerHTML = `<div class="slate-modal">
    <div class="slate-modal-close">✕</div>
    <div class="slate-hdr">
      <div class="slate-weather">${weatherText ? '🌤 ' + weatherText : ''}</div>
      <div>${isShootout ? '<span class="badge-shootout">🔥 Shootout</span>' : m.lowScoringSignal ? '<span class="badge-lowscore">🛡 Low Scoring</span>' : ''}</div>
    </div>
    <div class="slate-matchup">
      <div class="slate-team">
        <img class="slate-logo" src="${espnLogoUrl(g.awayAbbr)}" alt="${g.awayTeam}" onerror="this.style.visibility='hidden'">
        <div class="slate-team-name">${g.awayTeam}</div>
        <div class="slate-team-implied">${m.awayImplied ?? '—'}</div>
      </div>
      <div class="slate-vs">@</div>
      <div class="slate-team">
        <img class="slate-logo" src="${espnLogoUrl(g.homeAbbr)}" alt="${g.homeTeam}" onerror="this.style.visibility='hidden'">
        <div class="slate-team-name">${g.homeTeam}</div>
        <div class="slate-team-implied">${m.homeImplied ?? '—'}</div>
      </div>
    </div>
    <div class="slate-meta-row">
      <div class="slate-meta-item"><div class="slate-meta-val">${m.awayWinProb ?? '—'}%</div><div class="slate-meta-lbl">${g.awayTeam} Win</div></div>
      <div class="slate-meta-item center"><div class="slate-meta-val">${m.total ?? '—'}</div><div class="slate-meta-lbl">Total</div></div>
      <div class="slate-meta-item"><div class="slate-meta-val">${m.homeWinProb ?? '—'}%</div><div class="slate-meta-lbl">${g.homeTeam} Win</div></div>
    </div>
    <div class="slate-modal-section">
      <div class="slate-modal-section-hdr">${g.awayTeam} — Top TD Threats</div>
      ${awayTd.slice(0, 3).map(top3Row).join('') || '<div class="gs-meta">No data</div>'}
    </div>
    <div class="slate-modal-section">
      <div class="slate-modal-section-hdr">${g.homeTeam} — Top TD Threats</div>
      ${homeTd.slice(0, 3).map(top3Row).join('') || '<div class="gs-meta">No data</div>'}
    </div>
    <div class="slate-modal-section">
      <div class="slate-modal-section-hdr">Top Prop Projections (Game)</div>
      ${allProps.slice(0, 5).map(propRow).join('') || '<div class="gs-meta">No data</div>'}
    </div>
  </div>`;

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeSlateModal();
  });
  overlay.querySelector('.slate-modal-close').addEventListener('click', closeSlateModal);
  document.addEventListener('keydown', slateEscHandler);

  document.body.appendChild(overlay);
}

function slateEscHandler(e) {
  if (e.key === 'Escape') closeSlateModal();
}

function closeSlateModal() {
  const overlay = document.querySelector('.slate-overlay');
  if (overlay) overlay.remove();
  document.removeEventListener('keydown', slateEscHandler);
}

function renderTdProps(d) {
  document.getElementById('statusText').textContent = d.cached ? 'Cached' : 'Live';
  const allPlayers = d.players || [];
  if (!allPlayers.length) {
    document.getElementById('content').innerHTML = '<div class="empty"><h3>No player props found</h3><div>' + (d.error || '') + '</div></div>';
    return;
  }

  const { matchup, position, signal } = filterState.td;
  const players = filterPlayers(allPlayers, matchup, position, signal);

  const filterBarHTML = `<div class="filter-bar">
    ${renderMatchupSelect('td', allPlayers)}
    ${renderPositionPills('td', ['RB', 'WR', 'TE'])}
    <span class="filter-count">${players.length} of ${allPlayers.length} players</span>
  </div>
  <div style="margin-bottom:14px">${signalFilterPillsHTML('td', TAB_SIGNALS.td, signal)}</div>`;

  const rows = players.map(p => {
    const badgeHtml = p.badge ? `<span class="badge-shootout" style="color:${p.badge.color};background:transparent;border-color:${p.badge.color}66">${p.badge.label}</span>` : '';
    const key = rowKey(p);
    const isOpen = expandedKeys.td.has(key);
    const mainRow = `<tr class="expand-row" data-expand-key="${key}"><td class="td-name"><span class="expand-arrow${isOpen ? ' open' : ''}">▶</span>${p.name}</td>
      <td class="td-pos">${p.position}</td>
      <td class="td-team">${p.team} vs ${p.opponent}</td>
      <td class="td-prob">${p.prob}%</td>
      <td class="td-touch">${p.touches}</td>
      <td>${signalChipsHTML(p.signals)}</td>
      <td>${badgeHtml}</td>
    </tr>`;
    const detailRow = isOpen ? `<tr class="detail-row"><td colspan="7">
      <div class="detail-grid">
        <div><div class="detail-block-hdr">Signal Breakdown</div>${signalDetailListHTML(p.signals)}</div>
        <div><div class="detail-block-hdr">Key Stats</div>
          <div class="detail-sig-row"><span>Anytime TD Probability</span><span style="color:var(--teal);font-family:var(--mono)">${p.prob}%</span></div>
          <div class="detail-sig-row"><span>Touches (L5)</span><span style="font-family:var(--mono)">${p.touches}</span></div>
          <div class="detail-sig-row"><span>Confidence Tier</span><span style="color:${p.ci?.color || 'var(--t3)'};font-family:var(--mono)">${p.ci?.label || '—'}</span></div>
          ${p.injured ? `<div class="detail-sig-row"><span style="color:var(--red)">⚠ ${p.injuryStatus || 'Injured'}</span></div>` : ''}
        </div>
      </div>
    </td></tr>` : '';
    return mainRow + detailRow;
  }).join('');

  document.getElementById('content').innerHTML = filterBarHTML + `
    <table class="td-table">
      <thead><tr><th>Player</th><th>Pos</th><th>Matchup</th><th>Anytime TD%</th><th>Touches (L5)</th><th>Signals</th><th>Badge</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" style="text-align:center;color:var(--t3);padding:20px">No players match this filter</td></tr>'}</tbody>
    </table>
    <div class="empty" style="padding:16px 4px;text-align:left;font-size:11px">
      Player pool is roster-verified against ESPN's current roster. Click a row to expand for
      full signal detail. Signal filter narrows to only players flagging that specific signal,
      regardless of overall badge.
    </div>
  `;

  document.querySelectorAll('.expand-row').forEach(row => {
    row.addEventListener('click', () => toggleExpand('td', row.dataset.expandKey, () => renderTdProps(d)));
  });
  attachSignalFilterHandlers('td', (label) => { filterState.td.signal = label; renderTdProps(d); });

  attachFilterHandlers('td', renderTdProps);
}

async function loadRushProps() {
  document.getElementById('content').innerHTML = '<div class="empty"><h3>Loading rushing yards projections…</h3></div>';
  try {

// ── BEST PLAYS: combines all four prop types, filtered to genuinely notable plays only ──
// "True best plays" means only players who cleared a signal-backed badge threshold (Value
// Play or higher) — NOT a full list of every player on the slate. Ranking across TD
// probability, rushing yards, receiving yards, and passing yards (four different units)
// uses badge tier as the primary sort (Elite > All-Star > Value — that tier already reflects
// a fair, category-normalized "how good is this play" read, since each prop type's signal
// stack was tuned to its own typical range), signal count as the tiebreaker within a tier,
// and a rough 0-100 normalized value as the final tiebreaker.

let bestPlaysRaw = null;
let bestPlaysFilter = 'all';
let bestPlaysSignalFilter = 'all';

// Union of every signal label across all four prop types — filtering by e.g. "Pass-Heavy
// Script" naturally only matches PASS-type entries since that's the only type whose signals
// array contains that label, so this one filter set works correctly across mixed types.
const BEST_PLAYS_ALL_SIGNALS = [...new Set([...TAB_SIGNALS.td, ...TAB_SIGNALS.rush, ...TAB_SIGNALS.rec, ...TAB_SIGNALS.pass])];

async function loadBestPlays() {
  document.getElementById('content').innerHTML = '<div class="empty"><h3>Finding the best plays this week…</h3></div>';
  try {
    const [tdRes, rushRes, recRes, passRes] = await Promise.all([
      fetch('/api/props?week=' + week).then(r => r.json()),
      fetch('/api/rush-props?week=' + week).then(r => r.json()),
      fetch('/api/rec-props?week=' + week).then(r => r.json()),
      fetch('/api/pass-props?week=' + week).then(r => r.json()),
    ]);
    bestPlaysRaw = { td: tdRes.players || [], rush: rushRes.players || [], rec: recRes.players || [], pass: passRes.players || [] };
    renderBestPlays();
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="empty"><h3>Failed to load</h3><div>' + e.message + '</div></div>';
  }
}

function tierWeight(badge) {
  if (!badge) return 0;
  if (badge.label.includes('Elite')) return 3;
  if (badge.label.includes('All-Star')) return 2;
  if (badge.label.includes('Value')) return 1;
  return 0;
}

function buildUnifiedBestPlays(raw) {
  const td = raw.td.map(p => ({
    name: p.name, propType: 'TD', typeLabel: 'TD', position: p.position, team: p.team, opponent: p.opponent,
    displayValue: p.prob + '%', normalizedValue: (p.prob / 65) * 100,
    signalCount: p.signalCount, badge: p.badge, signals: p.signals, ci: p.ci,
    detailStats: [['Anytime TD Probability', p.prob + '%'], ['Touches (L5)', p.touches]],
  }));
  const rush = raw.rush.map(p => ({
    name: p.name, propType: 'RUSH', typeLabel: 'RUSH', position: 'RB', team: p.team, opponent: p.opponent,
    displayValue: p.projected + ' yds', normalizedValue: Math.min(100, (p.projected / 200) * 100),
    signalCount: p.signalCount, badge: p.badge, signals: p.signals, ci: p.ci,
    detailStats: [['Projected Yds', p.projected], ['Floor – Ceiling', p.floor + ' – ' + p.ceiling], ['Carries (L5)', p.carries]],
  }));
  const rec = raw.rec.map(p => ({
    name: p.name, propType: 'REC', typeLabel: 'REC', position: p.position, team: p.team, opponent: p.opponent,
    displayValue: p.projected + ' yds', normalizedValue: Math.min(100, (p.projected / 150) * 100),
    signalCount: p.signalCount, badge: p.badge, signals: p.signals, ci: p.ci,
    detailStats: [['Projected Yds', p.projected], ['Floor – Ceiling', p.floor + ' – ' + p.ceiling], ['Targets (L5)', p.targets]],
  }));
  const pass = raw.pass.map(p => ({
    name: p.name, propType: 'PASS', typeLabel: 'PASS', position: 'QB', team: p.team, opponent: p.opponent,
    displayValue: p.projected + ' yds', normalizedValue: Math.min(100, (p.projected / 350) * 100),
    signalCount: p.signalCount, badge: p.badge, signals: p.signals, ci: p.ci,
    detailStats: [['Projected Yds', p.projected], ['Floor – Ceiling', p.floor + ' – ' + p.ceiling], ['Attempts (L5)', p.attempts]],
  }));

  const all = [...td, ...rush, ...rec, ...pass];

  // The actual filter that makes this "best plays" instead of "every player": drop anyone
  // without a badge at all — that's the model saying this play isn't notable enough to flag.
  const notable = all.filter(p => p.badge);

  notable.sort((a, b) => {
    const tw = tierWeight(b.badge) - tierWeight(a.badge);
    if (tw !== 0) return tw;
    const sc = b.signalCount - a.signalCount;
    if (sc !== 0) return sc;
    return b.normalizedValue - a.normalizedValue;
  });

  return notable;
}

function renderBestPlays() {
  if (!bestPlaysRaw) return;
  document.getElementById('statusText').textContent = 'Live';

  const all = buildUnifiedBestPlays(bestPlaysRaw);
  let filtered = bestPlaysFilter === 'all' ? all : all.filter(p => p.propType === bestPlaysFilter);
  if (bestPlaysSignalFilter !== 'all') filtered = filtered.filter(p => hasActiveSignal(p, bestPlaysSignalFilter));
  const shown = filtered.slice(0, 20); // curated cap — "best plays," not a full leaderboard

  const pillsHTML = `<div class="filter-bar">
    <div class="pos-pills">
      <div class="pos-pill${bestPlaysFilter === 'all' ? ' on' : ''}" data-best-filter="all">All</div>
      <div class="pos-pill${bestPlaysFilter === 'TD' ? ' on' : ''}" data-best-filter="TD">Anytime TD</div>
      <div class="pos-pill${bestPlaysFilter === 'RUSH' ? ' on' : ''}" data-best-filter="RUSH">Rushing</div>
      <div class="pos-pill${bestPlaysFilter === 'REC' ? ' on' : ''}" data-best-filter="REC">Receiving</div>
      <div class="pos-pill${bestPlaysFilter === 'PASS' ? ' on' : ''}" data-best-filter="PASS">Passing</div>
    </div>
    <span class="filter-count">${shown.length} of ${filtered.length} notable plays</span>
  </div>
  <div style="margin-bottom:14px">${signalFilterPillsHTML('best', BEST_PLAYS_ALL_SIGNALS, bestPlaysSignalFilter)}</div>`;

  if (!shown.length) {
    document.getElementById('content').innerHTML = pillsHTML + '<div class="empty"><h3>No notable plays match this filter</h3><div>Try a different category or signal, or check back once more data is available.</div></div>';
    attachBestPlaysHandlers();
    return;
  }

  const typeClass = { TD: 'best-type-td', RUSH: 'best-type-rush', REC: 'best-type-rec', PASS: 'best-type-pass' };
  const rowClass = (badge) => badge.label.includes('Elite') ? ' elite' : badge.label.includes('All-Star') ? ' allstar' : '';

  const rows = shown.map((p, i) => {
    const key = rowKey(p) + '|' + p.propType; // same player can appear under multiple prop types
    const isOpen = expandedKeys.best.has(key);
    return `<div class="best-row${rowClass(p.badge)}">
    <div class="best-row-top" data-expand-key="${key}">
      <div class="best-rank">${i + 1}</div>
      <span class="expand-arrow${isOpen ? ' open' : ''}">▶</span>
      <div class="best-type-tag ${typeClass[p.propType]}">${p.typeLabel}</div>
      <div class="best-info">
        <div class="best-name">${p.name}${p.position ? ` <span style="color:var(--t3);font-weight:400;font-size:11px">(${p.position})</span>` : ''}</div>
        <div class="best-sub">${p.team} vs ${p.opponent}</div>
      </div>
      <div class="best-value">${p.displayValue}</div>
      <div class="best-badge" style="color:${p.badge.color}">${p.badge.label}</div>
    </div>
    <div class="best-expand${isOpen ? ' open' : ''}">
      <div class="detail-grid">
        <div><div class="detail-block-hdr">Signal Breakdown</div>${signalDetailListHTML(p.signals)}</div>
        <div><div class="detail-block-hdr">Key Stats</div>
          ${p.detailStats.map(([label, val]) => `<div class="detail-sig-row"><span>${label}</span><span style="color:var(--teal);font-family:var(--mono)">${val}</span></div>`).join('')}
          <div class="detail-sig-row"><span>Confidence Tier</span><span style="color:${p.ci?.color || 'var(--t3)'};font-family:var(--mono)">${p.ci?.label || '—'}</span></div>
        </div>
      </div>
    </div>
  </div>`;
  }).join('');

  document.getElementById('content').innerHTML = pillsHTML + `<div class="best-list">${rows}</div>
    <div class="empty" style="padding:16px 4px;text-align:left;font-size:11px">
      Only plays that cleared a signal-backed badge (Value Play or higher) show here — this
      is a curated list, not every player on the slate. Ranked by badge tier first, then
      signal count, then a normalized value score to compare fairly across prop types. Click
      a row to expand for the full signal breakdown.
    </div>`;

  document.querySelectorAll('.best-row-top').forEach(row => {
    row.addEventListener('click', () => toggleExpand('best', row.dataset.expandKey, renderBestPlays));
  });
  attachBestPlaysHandlers();
}

function attachBestPlaysHandlers() {
  document.querySelectorAll('[data-best-filter]').forEach(pill => {
    pill.addEventListener('click', () => {
      bestPlaysFilter = pill.dataset.bestFilter;
      renderBestPlays();
    });
  });
  attachSignalFilterHandlers('best', (label) => { bestPlaysSignalFilter = label; renderBestPlays(); });
}

let seasonCategory = 'wins';
const seasonRawData = { wins: null, td: null, rush: null, rec: null, pass: null };

async function loadSeasonCategory(category) {
  seasonCategory = category;
  if (seasonRawData[category]) {
    renderSeasonProjections(seasonRawData[category]);
    return;
  }
  document.getElementById('content').innerHTML = renderSeasonPills(category) +
    '<div class="empty"><h3>Loading season projections…</h3><div style="font-size:11px;margin-top:6px">This pulls a full season schedule for all 32 teams — can take a bit longer than the weekly tabs.</div></div>';
  try {
    const r = await fetch('/api/season?category=' + category);
    const d = await r.json();
    seasonRawData[category] = d;
    renderSeasonProjections(d);
  } catch (e) {
    document.getElementById('content').innerHTML = renderSeasonPills(category) + '<div class="empty"><h3>Failed to load</h3><div>' + e.message + '</div></div>';
  }
}

function renderSeasonPills(active) {
  const labels = { wins: 'Team Wins', td: 'TD Totals', rush: 'Rushing Yds', rec: 'Receiving Yds', pass: 'Passing Yds' };
  return `<div class="filter-bar">
    <div class="pos-pills">
      ${Object.entries(labels).map(([key, label]) =>
        `<div class="pos-pill${active === key ? ' on' : ''}" data-season-cat="${key}">${label}</div>`
      ).join('')}
    </div>
  </div>`;
}

function renderSeasonProjections(d) {
  document.getElementById('statusText').textContent = d.cached ? 'Cached' : 'Live';
  const pillsHTML = renderSeasonPills(d.category);

  if (d.error) {
    document.getElementById('content').innerHTML = pillsHTML + '<div class="empty"><h3>' + d.error + '</h3></div>';
    attachSeasonPillHandlers();
    return;
  }

  const results = d.results || [];
  if (!results.length) {
    document.getElementById('content').innerHTML = pillsHTML + '<div class="empty"><h3>No results found</h3></div>';
    attachSeasonPillHandlers();
    return;
  }

  let table;
  if (d.category === 'wins') {
    const rows = results.map((r, i) => `<tr>
      <td class="td-name">${i + 1}. ${r.team}</td>
      <td class="td-touch">${r.actualWins}-${r.actualLosses}</td>
      <td class="td-touch">${r.gamesRemaining}</td>
      <td class="td-prob">${r.projectedTotalWins}</td>
    </tr>`).join('');
    table = `<table class="td-table">
      <thead><tr><th>Team</th><th>Record So Far</th><th>Games Left</th><th>Projected Total Wins</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  } else if (d.category === 'td') {
    const rows = results.map((r, i) => `<tr>
      <td class="td-name">${i + 1}. ${r.name}</td>
      <td class="td-pos">${r.position}</td>
      <td class="td-team">${r.team}</td>
      <td class="td-touch">${r.gamesRemaining}</td>
      <td class="td-prob">${r.projectedSeasonTds}</td>
    </tr>`).join('');
    table = `<table class="td-table">
      <thead><tr><th>Player</th><th>Pos</th><th>Team</th><th>Games Left</th><th>Projected Season TDs</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  } else {
    const statLabel = { rush: 'Rushing', rec: 'Receiving', pass: 'Passing' }[d.category];
    const rows = results.map((r, i) => `<tr>
      <td class="td-name">${i + 1}. ${r.name}</td>
      <td class="td-team">${r.team}</td>
      <td class="td-touch">${r.gamesRemaining}</td>
      <td class="td-prob">${r.projectedSeasonYards.toLocaleString()}</td>
    </tr>`).join('');
    table = `<table class="td-table">
      <thead><tr><th>Player</th><th>Team</th><th>Games Left</th><th>Projected ${statLabel} Yards</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  document.getElementById('content').innerHTML = pillsHTML + table + `
    <div class="empty" style="padding:16px 4px;text-align:left;font-size:11px">
      Season total = sum of each team's real remaining schedule, run through the same
      per-game models used in the weekly tabs. Framework/plumbing pass, not yet calibrated,
      and does not yet have roster filtering applied.
    </div>
  `;
  attachSeasonPillHandlers();
}

function attachSeasonPillHandlers() {
  document.querySelectorAll('[data-season-cat]').forEach(pill => {
    pill.addEventListener('click', () => loadSeasonCategory(pill.dataset.seasonCat));
  });
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  currentTab = t.dataset.tab;
  if (currentTab === 'week') loadThisWeek();
  else if (currentTab === 'team') loadTeamModel();
  else if (currentTab === 'td') loadTdProps();
  else if (currentTab === 'rush') loadRushProps();
  else if (currentTab === 'rec') loadRecProps();
  else if (currentTab === 'pass') loadPassProps();
  else if (currentTab === 'best') loadBestPlays();
  else if (currentTab === 'season') loadSeasonCategory(seasonCategory);
  else {
    document.getElementById('content').innerHTML = '<div class="empty"><h3>Not built yet</h3><div>This tab is next up in the build order.</div></div>';
  }
}));

loadThisWeek();
</script>
</body>
</html>
